name: telegram

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'
      new_package:
        description: 'New package name'
        required: true
        default: 'com.konasl.nagad'
      debug_mode:
        description: 'Enable verbose debug output'
        required: false
        default: 'false'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true

      # ─────────────────────────────────────────────
      # 2. JAVA + BASE TOOLS
      # ─────────────────────────────────────────────
      - name: Setup Java & Base Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jre-headless \
            zipalign \
            wget \
            unzip \
            python3 \
            python3-lxml \
            aapt \
            libxml2-utils \
            binutils \
            file \
            findutils \
            grep \
            sed \
            coreutils
          java -version
          python3 --version

      # ─────────────────────────────────────────────
      # 3. ANDROID SDK + BUILD TOOLS
      # ─────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools \
                  /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          # Create symlinks
          for tool in aapt2 apksigner zipalign aapt d8; do
            sudo ln -sf /opt/android-sdk/build-tools/34.0.0/$tool \
                        /usr/local/bin/$tool 2>/dev/null || true
          done
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk"   >> $GITHUB_ENV
          aapt2 version
          apksigner version

      # ─────────────────────────────────────────────
      # 4. APKTOOL (latest stable)
      # ─────────────────────────────────────────────
      - name: Setup APKTool
        run: |
          sudo wget -q \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      # ─────────────────────────────────────────────
      # 5. DETECT ORIGINAL PACKAGE NAME
      # ─────────────────────────────────────────────
      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          NEW_PKG="${{ github.event.inputs.new_package }}"
          OLD_PACKAGE=""

          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' \
              "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi

          # Fallback: check apktool.yml
          if [ -z "$OLD_PACKAGE" ] && [ -f "$DECOMPILED_DIR/apktool.yml" ]; then
            OLD_PACKAGE=$(grep -oP 'packageId:\s*\K\S+' \
              "$DECOMPILED_DIR/apktool.yml" | head -1)
          fi

          # Fallback: detect from smali directory name
          if [ -z "$OLD_PACKAGE" ]; then
            SMALI_DIR=$(find "$DECOMPILED_DIR" -maxdepth 1 -type d -name "smali*" | head -1)
            if [ -n "$SMALI_DIR" ]; then
              OLD_PACKAGE=$(find "$SMALI_DIR" -name "*.smali" | head -1 | \
                xargs grep -oP '\.class\s+\S+\s+\K\S+' 2>/dev/null | \
                head -1 | tr '/' '.' | sed 's/\.[A-Z].*//' || echo "")
            fi
          fi

          # Final fallback
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp.w4b"
          fi

          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "NEW_PACKAGE=$NEW_PKG"     >> $GITHUB_ENV
          echo "✅ Detected old package : $OLD_PACKAGE"
          echo "✅ Target new package   : $NEW_PKG"

      # ─────────────────────────────────────────────
      # 6. FULL PACKAGE RENAME — all file types
      # ─────────────────────────────────────────────
      - name: Full Package Rename (Python master script)
        run: |
          cat > /tmp/rename_pkg.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Comprehensive package renamer for decompiled APK directories.
          Handles: AndroidManifest.xml, apktool.yml, *.xml, *.smali,
                   *.properties, *.json, *.gradle, *.kt, *.java, *.html
          """
          import os, sys, re

          old = sys.argv[1]   # e.g. com.whatsapp.w4b
          new = sys.argv[2]   # e.g. com.konasl.nagad
          root = sys.argv[3]  # decompiled dir

          old_slash = old.replace('.', '/')
          new_slash = new.replace('.', '/')

          TEXT_EXTS = {
            '.xml', '.smali', '.properties', '.yml', '.yaml',
            '.json', '.gradle', '.kt', '.java', '.html', '.txt',
            '.cfg', '.ini', '.conf', '.plist', '.mf', '.sf',
          }

          stats = {'files': 0, 'replacements': 0}

          def replace_in_file(path):
              try:
                  with open(path, 'r', encoding='utf-8', errors='replace') as f:
                      content = f.read()
              except Exception:
                  return

              original = content

              # 1. Slash-form (smali class paths, resource paths)
              content = content.replace(old_slash, new_slash)

              # 2. Dotted form — careful not to double-replace if new starts with old
              if new.startswith(old):
                  suffix = re.escape(new[len(old):])
                  pattern = re.escape(old) + r'(?!' + suffix + r')'
              else:
                  pattern = re.escape(old)
              content = re.sub(pattern, new, content)

              if content != original:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  stats['files'] += 1
                  stats['replacements'] += (
                      content.count(new) - original.count(new)
                  )

          for dirpath, dirnames, filenames in os.walk(root):
              # Skip binary asset dirs that can't/shouldn't be text-edited
              dirnames[:] = [d for d in dirnames
                             if d not in ('META-INF',)]
              for fname in filenames:
                  ext = os.path.splitext(fname)[1].lower()
                  if ext in TEXT_EXTS:
                      replace_in_file(os.path.join(dirpath, fname))

          print(f"✅ Renamed in {stats['files']} files "
                f"({stats['replacements']} extra occurrences added)")
          PYEOF
          python3 /tmp/rename_pkg.py \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}" \
            "${{ github.event.inputs.decompiled_folder }}"

      # ─────────────────────────────────────────────
      # 7. FIX AndroidManifest.xml — problematic attrs
      # ─────────────────────────────────────────────
      - name: Fix AndroidManifest.xml Attributes
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          cat > /tmp/fix_manifest.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys, re

          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          fixes = []

          # 1. Remove requiredSplitTypes (causes build failure)
          if 'requiredSplitTypes' in content:
              content = re.sub(r'\s+android:requiredSplitTypes="[^"]*"', '', content)
              content = re.sub(r'\s+requiredSplitTypes="[^"]*"',         '', content)
              fixes.append('removed requiredSplitTypes')

          # 2. Remove isSplitRequired if it would be dangling
          if 'isSplitRequired' in content and 'requiredSplitTypes' not in content:
              content = re.sub(r'\s+android:isSplitRequired="[^"]*"', '', content)
              fixes.append('removed dangling isSplitRequired')

          # 3. Remove compileSdkVersion / compileSdkVersionCodename
          #    (not valid in binary manifest, causes aapt2 errors)
          for attr in ('compileSdkVersion', 'compileSdkVersionCodename'):
              pattern = r'\s+android:' + re.escape(attr) + r'="[^"]*"'
              if re.search(pattern, content):
                  content = re.sub(pattern, '', content)
                  fixes.append(f'removed {attr}')

          # 4. Fix duplicate package attribute (keep only first)
          # (rare but happens after naive sed replacement)
          manifest_tag_match = re.search(r'<manifest\b[^>]*>', content, re.DOTALL)
          if manifest_tag_match:
              tag = manifest_tag_match.group(0)
              pkg_matches = re.findall(r'package="[^"]+"', tag)
              if len(pkg_matches) > 1:
                  # Remove all but first occurrence inside the tag
                  first = True
                  def dedup(m):
                      nonlocal first
                      if first:
                          first = False
                          return m.group(0)
                      return ''
                  new_tag = re.sub(r'package="[^"]+"', dedup, tag)
                  content = content.replace(tag, new_tag, 1)
                  fixes.append('deduplicated package attribute')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          if fixes:
              print('✅ Manifest fixes applied:', ', '.join(fixes))
          else:
              print('✅ Manifest OK — no fixes needed')
          PYEOF
          python3 /tmp/fix_manifest.py "$MANIFEST"

      # ─────────────────────────────────────────────
      # 8. FIX apktool.yml
      # ─────────────────────────────────────────────
      - name: Fix apktool.yml
        run: |
          YML="${{ github.event.inputs.decompiled_folder }}/apktool.yml"
          if [ ! -f "$YML" ]; then
            echo "apktool.yml not found, skipping"
            exit 0
          fi

          cat > /tmp/fix_yml.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Patch apktool.yml:
          - Update package name references
          - Set renameManifestPackage to new name
          - Remove doNotCompress entries that cause issues (optional)
          - Ensure versionInfo is sane
          """
          import sys, re

          path   = sys.argv[1]
          old    = sys.argv[2]
          new    = sys.argv[3]

          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # Replace old package with new
          content = content.replace(old, new)

          # Ensure renameManifestPackage is set correctly
          if 'renameManifestPackage:' in content:
              content = re.sub(
                  r'renameManifestPackage:\s*\S*',
                  f'renameManifestPackage: {new}',
                  content
              )
          else:
              # Insert after first line (the !!brut.androlib... header)
              lines = content.split('\n')
              insert_at = 1
              for i, l in enumerate(lines):
                  if l.startswith('apkFileName') or l.startswith('isFrameworkApk'):
                      insert_at = i
                      break
              lines.insert(insert_at, f'renameManifestPackage: {new}')
              content = '\n'.join(lines)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          print('✅ apktool.yml patched')
          PYEOF
          python3 /tmp/fix_yml.py \
            "$YML" \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}"

          echo "=== apktool.yml (relevant lines) ==="
          grep -iE "package|rename|version|isFramework" "$YML" || true

      # ─────────────────────────────────────────────
      # 9. FIX PROVIDER AUTHORITIES (critical for crash)
      # ─────────────────────────────────────────────
      - name: Fix Provider Authorities & Intent Filters
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"

          cat > /tmp/fix_providers.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Fix ContentProvider / FileProvider authorities and
          intent-filter data authorities that still reference old package.
          These cause immediate crashes at startup if wrong.
          """
          import sys, re

          path = sys.argv[1]
          old  = sys.argv[2]
          new  = sys.argv[3]

          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          # authorities="com.old.pkg.provider" or authorities="com.old.pkg.fileprovider"
          pattern = r'(android:authorities=")([^"]*' + re.escape(old) + r'[^"]*)(")'
          def fix_auth(m):
              fixed = m.group(2).replace(old, new)
              return m.group(1) + fixed + m.group(3)

          new_content, n = re.subn(pattern, fix_auth, content)
          print(f'✅ Fixed {n} provider authority reference(s)')

          # host="com.old.pkg" in intent-filter data tags
          host_pattern = r'(android:host=")(' + re.escape(old) + r')(")' 
          new_content, nh = re.subn(host_pattern,
              lambda m: m.group(1) + new + m.group(3), new_content)
          if nh:
              print(f'✅ Fixed {nh} intent-filter host reference(s)')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(new_content)
          PYEOF
          python3 /tmp/fix_providers.py "$MANIFEST" "$OLD" "$NEW"

      # ─────────────────────────────────────────────
      # 10. FIX RES/XML — FileProvider paths file
      # ─────────────────────────────────────────────
      - name: Fix res/xml FileProvider path descriptors
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"
          # FileProvider XML files often live in res/xml/
          find "$DECOMPILED_DIR/res/xml" -name "*.xml" 2>/dev/null | \
            xargs -r sed -i "s|${OLD}|${NEW}|g"
          echo "✅ res/xml fixed"

      # ─────────────────────────────────────────────
      # 11. FIX SHARED PREFERENCES / SQLITE names in smali
      #     (crash source: hardcoded old pkg in prefs/db names)
      # ─────────────────────────────────────────────
      - name: Fix Hardcoded Package Strings in Smali
        run: |
          cat > /tmp/fix_smali_deep.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Deep smali string fixer.
          Replaces ALL occurrences of old package (dotted + slash)
          in every smali line that contains a string literal or annotation.

          Also fixes:
          - .class / .super / .implements / .field / .method type descriptors
            that still carry the old slash-path
          - const-string / sput-object BuildConfig.APPLICATION_ID patterns
          """
          import os, sys, re

          old  = sys.argv[1]
          new  = sys.argv[2]
          root = sys.argv[3]

          old_slash = old.replace('.', '/')
          new_slash = new.replace('.', '/')

          # Build safe patterns
          if new.startswith(old):
              sfx = re.escape(new[len(old):])
              dot_pat   = re.compile(re.escape(old)       + r'(?!' + sfx + r')')
          else:
              dot_pat   = re.compile(re.escape(old))

          if new_slash.startswith(old_slash):
              sfx2 = re.escape(new_slash[len(old_slash):])
              slash_pat = re.compile(re.escape(old_slash) + r'(?!' + sfx2 + r')')
          else:
              slash_pat = re.compile(re.escape(old_slash))

          changed_files = 0
          changed_lines = 0

          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if not fname.endswith('.smali'):
                      continue
                  fpath = os.path.join(dirpath, fname)
                  try:
                      with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                          lines = f.readlines()
                  except Exception:
                      continue

                  new_lines = []
                  file_changed = False
                  for line in lines:
                      nl = slash_pat.sub(new_slash, line)
                      nl = dot_pat.sub(new,         nl)
                      if nl != line:
                          file_changed = True
                          changed_lines += 1
                      new_lines.append(nl)

                  if file_changed:
                      changed_files += 1
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.writelines(new_lines)

          print(f'✅ Smali deep fix: {changed_files} files, {changed_lines} lines updated')
          PYEOF
          python3 /tmp/fix_smali_deep.py \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}" \
            "${{ github.event.inputs.decompiled_folder }}"

      # ─────────────────────────────────────────────
      # 12. RENAME SMALI DIRECTORY STRUCTURE
      #     (physical folder rename to match new package path)
      # ─────────────────────────────────────────────
      - name: Rename Smali Directory Paths
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW" | tr '.' '/')

          cat > /tmp/rename_dirs.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Rename physical smali directory tree to match new package path.
          e.g. smali/com/whatsapp/w4b -> smali/com/konasl/nagad
          """
          import os, sys, shutil

          old_path = sys.argv[1]   # com/whatsapp/w4b
          new_path = sys.argv[2]   # com/konasl/nagad
          root     = sys.argv[3]

          old_parts = old_path.split('/')
          new_parts = new_path.split('/')

          moved = 0
          # Walk all smali_* directories
          for smali_dir in os.listdir(root):
              if not smali_dir.startswith('smali'):
                  continue
              smali_root = os.path.join(root, smali_dir)
              if not os.path.isdir(smali_root):
                  continue
              old_full = os.path.join(smali_root, old_path)
              new_full = os.path.join(smali_root, new_path)
              if os.path.isdir(old_full):
                  os.makedirs(os.path.dirname(new_full), exist_ok=True)
                  if os.path.exists(new_full):
                      # Merge: move contents
                      for item in os.listdir(old_full):
                          src = os.path.join(old_full, item)
                          dst = os.path.join(new_full, item)
                          if not os.path.exists(dst):
                              shutil.move(src, dst)
                      shutil.rmtree(old_full, ignore_errors=True)
                  else:
                      shutil.move(old_full, new_full)
                  moved += 1
                  print(f'  Moved: {old_full} -> {new_full}')

          # Clean up now-empty old package dirs
          for smali_dir in os.listdir(root):
              if not smali_dir.startswith('smali'):
                  continue
              smali_root = os.path.join(root, smali_dir)
              # Walk bottom-up to remove empty dirs
              for dirpath, dirnames, filenames in os.walk(smali_root, topdown=False):
                  if not filenames and not os.listdir(dirpath):
                      try:
                          os.rmdir(dirpath)
                      except Exception:
                          pass

          print(f'✅ Renamed {moved} smali package director(ies)')
          PYEOF
          python3 /tmp/rename_dirs.py \
            "$OLD_PATH" \
            "$NEW_PATH" \
            "$DECOMPILED_DIR"

      # ─────────────────────────────────────────────
      # 13. VERIFY — no old package should remain
      # ─────────────────────────────────────────────
      - name: Verify Rename Completeness
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"

          echo "════════════════════════════════════════"
          echo "  POST-RENAME VERIFICATION REPORT"
          echo "════════════════════════════════════════"

          echo ""
          echo "── AndroidManifest.xml ──"
          OLD_COUNT=$(grep -c "$OLD" "$DECOMPILED_DIR/AndroidManifest.xml" 2>/dev/null || echo 0)
          echo "  Old pkg occurrences : $OLD_COUNT  (should be 0)"
          NEW_COUNT=$(grep -c "$NEW" "$DECOMPILED_DIR/AndroidManifest.xml" 2>/dev/null || echo 0)
          echo "  New pkg occurrences : $NEW_COUNT"
          head -3 "$DECOMPILED_DIR/AndroidManifest.xml"

          echo ""
          echo "── apktool.yml ──"
          grep -iE "package|rename|version" "$DECOMPILED_DIR/apktool.yml" 2>/dev/null || echo "  (not found)"

          echo ""
          echo "── Provider authorities ──"
          grep -n "authorities" "$DECOMPILED_DIR/AndroidManifest.xml" || echo "  None found"

          echo ""
          echo "── requiredSplitTypes check ──"
          grep -n "requiredSplitTypes" "$DECOMPILED_DIR/AndroidManifest.xml" \
            && echo "⚠️  WARNING: requiredSplitTypes still present" \
            || echo "  ✅ Clean"

          echo ""
          echo "── Old pkg in smali (sample, should be 0) ──"
          SMALI_OLD=$(grep -rl "$OLD" "$DECOMPILED_DIR" --include="*.smali" 2>/dev/null | wc -l)
          echo "  Smali files still containing old pkg: $SMALI_OLD"
          if [ "$SMALI_OLD" -gt 0 ]; then
            echo "  Sample files:"
            grep -rl "$OLD" "$DECOMPILED_DIR" --include="*.smali" | head -5
          fi

          echo ""
          echo "── Smali directory structure ──"
          find "$DECOMPILED_DIR" -maxdepth 5 -type d -name "$(echo $NEW | tr '.' '/' | cut -d'/' -f3)" \
            | head -10 || echo "  (check manually)"

          echo "════════════════════════════════════════"

      # ─────────────────────────────────────────────
      # 14. RECOMPILE APK
      # ─────────────────────────────────────────────
      - name: Recompile APK
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OUT="recompiled_unsigned.apk"

          build_apk() {
            local label="$1"; shift
            echo ""
            echo "═══ Build attempt: $label ═══"
            if apktool b "$DIR" -o "$OUT" -f "$@" 2>&1; then
              echo "✅ Build SUCCESS ($label)"
              return 0
            else
              echo "⚠️  Build FAILED ($label)"
              return 1
            fi
          }

          rm -f "$OUT"

          build_apk "default" \
            || build_apk "aapt2" --use-aapt2 \
            || build_apk "aapt2+no-crunch" --use-aapt2 --no-crunch \
            || build_apk "aapt2+no-crunch+no-src" --use-aapt2 --no-crunch --no-src \
            || { echo "❌ All build attempts failed!"; exit 1; }

          if [ ! -f "$OUT" ]; then
            echo "❌ APK file not created!"
            exit 1
          fi
          ls -lh "$OUT"

      # ─────────────────────────────────────────────
      # 15. VERIFY APK STRUCTURE
      # ─────────────────────────────────────────────
      - name: Verify APK Structure
        run: |
          echo "── aapt2 dump badging ──"
          aapt2 dump badging recompiled_unsigned.apk 2>&1 | head -20 \
            || echo "⚠️  aapt2 dump failed (APK may still be installable)"

          echo ""
          echo "── APK entries (top 20) ──"
          unzip -l recompiled_unsigned.apk | head -20

          echo ""
          echo "── Package in APK manifest ──"
          aapt dump badging recompiled_unsigned.apk 2>/dev/null | \
            grep "^package:" || echo "  (aapt fallback failed)"

      # ─────────────────────────────────────────────
      # 16. GENERATE KEYSTORE
      # ─────────────────────────────────────────────
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4baes \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4baes123 \
            -keypass  w4baes123 \
            -dname "CN=W4BAES,OU=Dev,O=W4BAES,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt
          echo "✅ Keystore generated"

      # ─────────────────────────────────────────────
      # 17. ZIPALIGN
      # ─────────────────────────────────────────────
      - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          zipalign -c -v 4 aligned.apk \
            && echo "✅ Alignment check: PASSED" \
            || echo "⚠️  Alignment check: FAILED (will try anyway)"

      # ─────────────────────────────────────────────
      # 18. SIGN (v1 + v2 + v3)
      # ─────────────────────────────────────────────
      - name: Sign APK
        run: |
          apksigner sign \
            --ks           my.keystore \
            --ks-pass      pass:w4baes123 \
            --key-pass     pass:w4baes123 \
            --ks-key-alias w4baes \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out signed_app.apk \
            aligned.apk

          echo ""
          apksigner verify --verbose --print-certs signed_app.apk \
            && echo "✅ Signature verify: PASSED" \
            || { echo "❌ Signature verify: FAILED"; exit 1; }

          echo ""
          ls -lh signed_app.apk

      # ─────────────────────────────────────────────
      # 19. FINAL PACKAGE NAME CONFIRMATION
      # ─────────────────────────────────────────────
      - name: Final Package Name Confirmation
        run: |
          echo "── Final APK package name ──"
          aapt2 dump badging signed_app.apk 2>/dev/null | grep "^package:" \
            || aapt  dump badging signed_app.apk 2>/dev/null | grep "^package:" \
            || unzip -p signed_app.apk AndroidManifest.xml | \
               strings | grep -oP 'com\.[a-z][a-z0-9.]+' | head -5 \
            || echo "  (could not extract — check manually)"

      # ─────────────────────────────────────────────
      # 20. UPLOAD ARTIFACT
      # ─────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4baes-apk
          path: signed_app.apk
          retention-days: 90

      # ─────────────────────────────────────────────
      # 21. CREATE GITHUB RELEASE
      # ─────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4baes-v1.0.${{ github.run_number }}
          name: W4BAES v1.0.${{ github.run_number }}
          body: |
            ## W4BAES Build #${{ github.run_number }}

            | Field         | Value                          |
            |---------------|-------------------------------|
            | New Package   | `${{ env.NEW_PACKAGE }}`       |
            | Old Package   | `${{ env.OLD_PACKAGE }}`       |
            | Build Number  | `#${{ github.run_number }}`    |
            | Signing       | v1 + v2 + v3 (apksigner)       |
            | Java          | OpenJDK 17                     |
            | APKTool       | 2.10.0                         |
            | Build Tools   | 34.0.0                         |

            ### ✅ Crash fixes applied
            - Full smali deep rename (dotted + slash form)
            - Physical smali directory rename
            - Provider/FileProvider authority fix
            - AndroidManifest attribute cleanup
            - apktool.yml `renameManifestPackage` set

          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

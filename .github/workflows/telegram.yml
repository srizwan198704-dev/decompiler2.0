name: Telegram

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'
      new_package:
        description: 'New package name'
        required: true
        default: 'com.konasl.nagad'
      debug_mode:
        description: 'Enable verbose debug output'
        required: false
        default: 'false'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:

      # ═══════════════════════════════════════════════
      # 1. CHECKOUT
      # ═══════════════════════════════════════════════
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true

      # ═══════════════════════════════════════════════
      # 2. JAVA + BASE TOOLS
      # ═══════════════════════════════════════════════
      - name: Setup Java & Base Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jre-headless zipalign wget unzip python3 \
            python3-lxml aapt libxml2-utils binutils file \
            findutils grep sed coreutils patchelf
          java -version && python3 --version

      # ═══════════════════════════════════════════════
      # 3. ANDROID SDK + BUILD TOOLS
      # ═══════════════════════════════════════════════
      - name: Setup Android SDK
        run: |
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools \
                  /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          for tool in aapt2 apksigner zipalign aapt d8; do
            sudo ln -sf /opt/android-sdk/build-tools/34.0.0/$tool \
                        /usr/local/bin/$tool 2>/dev/null || true
          done
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk"   >> $GITHUB_ENV
          aapt2 version && apksigner version

      # ═══════════════════════════════════════════════
      # 4. APKTOOL
      # ═══════════════════════════════════════════════
      - name: Setup APKTool
        run: |
          sudo wget -q \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      # ═══════════════════════════════════════════════
      # 5. DETECT OLD PACKAGE NAME
      # ═══════════════════════════════════════════════
      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          NEW_PKG="${{ github.event.inputs.new_package }}"
          OLD_PACKAGE=""

          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' \
              "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi
          if [ -z "$OLD_PACKAGE" ] && [ -f "$DECOMPILED_DIR/apktool.yml" ]; then
            OLD_PACKAGE=$(grep -oP 'packageId:\s*\K\S+' \
              "$DECOMPILED_DIR/apktool.yml" | head -1)
          fi
          [ -z "$OLD_PACKAGE" ] && OLD_PACKAGE="org.telegram.messenger"

          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "NEW_PACKAGE=$NEW_PKG"     >> $GITHUB_ENV
          echo "✅ Old: $OLD_PACKAGE  →  New: $NEW_PKG"

      # ═══════════════════════════════════════════════
      # 6. FULL PACKAGE RENAME
      # ═══════════════════════════════════════════════
      - name: Full Package Rename
        run: |
          cat > /tmp/rename_pkg.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys, re
          old, new, root = sys.argv[1], sys.argv[2], sys.argv[3]
          old_slash = old.replace('.', '/')
          new_slash = new.replace('.', '/')
          TEXT_EXTS = {'.xml','.smali','.properties','.yml','.yaml',
            '.json','.gradle','.kt','.java','.html','.txt',
            '.cfg','.ini','.conf','.plist','.mf','.sf'}
          if new.startswith(old):
              sfx     = re.escape(new[len(old):])
              dot_pat = re.compile(re.escape(old) + r'(?!' + sfx + r')')
          else:
              dot_pat = re.compile(re.escape(old))
          stats = {'files': 0}
          def replace_in_file(path):
              try:
                  with open(path,'r',encoding='utf-8',errors='replace') as f:
                      c = f.read()
              except: return
              orig = c
              c = c.replace(old_slash, new_slash)
              c = dot_pat.sub(new, c)
              if c != orig:
                  with open(path,'w',encoding='utf-8') as f: f.write(c)
                  stats['files'] += 1
          for dp, dn, fnames in os.walk(root):
              dn[:] = [d for d in dn if d not in ('META-INF',)]
              for fn in fnames:
                  if os.path.splitext(fn)[1].lower() in TEXT_EXTS:
                      replace_in_file(os.path.join(dp, fn))
          print(f"✅ Renamed in {stats['files']} files")
          PYEOF
          python3 /tmp/rename_pkg.py \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}" \
            "${{ github.event.inputs.decompiled_folder }}"

      # ═══════════════════════════════════════════════
      # 7. FIX AndroidManifest.xml
      # ═══════════════════════════════════════════════
      - name: Fix AndroidManifest.xml Attributes
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          cat > /tmp/fix_manifest.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys, re
          path = sys.argv[1]
          with open(path,'r',encoding='utf-8') as f: content = f.read()
          fixes = []
          if 'requiredSplitTypes' in content:
              content = re.sub(r'\s+android:requiredSplitTypes="[^"]*"','',content)
              content = re.sub(r'\s+requiredSplitTypes="[^"]*"','',content)
              fixes.append('removed requiredSplitTypes')
          if 'isSplitRequired' in content and 'requiredSplitTypes' not in content:
              content = re.sub(r'\s+android:isSplitRequired="[^"]*"','',content)
              fixes.append('removed dangling isSplitRequired')
          for attr in ('compileSdkVersion','compileSdkVersionCodename'):
              pat = r'\s+android:' + re.escape(attr) + r'="[^"]*"'
              if re.search(pat, content):
                  content = re.sub(pat,'',content)
                  fixes.append(f'removed {attr}')
          m = re.search(r'<manifest\b[^>]*>', content, re.DOTALL)
          if m:
              tag = m.group(0)
              if len(re.findall(r'package="[^"]+"', tag)) > 1:
                  seen = [False]
                  def dedup(mx):
                      if not seen[0]:
                          seen[0] = True; return mx.group(0)
                      return ''
                  content = content.replace(tag, re.sub(r'package="[^"]+"',dedup,tag),1)
                  fixes.append('deduped package')
          with open(path,'w',encoding='utf-8') as f: f.write(content)
          print('✅ Manifest:', ', '.join(fixes) if fixes else 'OK')
          PYEOF
          python3 /tmp/fix_manifest.py "$MANIFEST"

      # ═══════════════════════════════════════════════
      # 8. FIX apktool.yml
      # ═══════════════════════════════════════════════
      - name: Fix apktool.yml
        run: |
          YML="${{ github.event.inputs.decompiled_folder }}/apktool.yml"
          [ ! -f "$YML" ] && echo "not found, skip" && exit 0
          cat > /tmp/fix_yml.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys, re
          path, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path,'r',encoding='utf-8') as f: c = f.read()
          c = c.replace(old, new)
          if 'renameManifestPackage:' in c:
              c = re.sub(r'renameManifestPackage:\s*\S*',
                         f'renameManifestPackage: {new}', c)
          else:
              lines = c.split('\n'); ins = 1
              for i,l in enumerate(lines):
                  if l.startswith('apkFileName') or l.startswith('isFrameworkApk'):
                      ins = i; break
              lines.insert(ins, f'renameManifestPackage: {new}')
              c = '\n'.join(lines)
          with open(path,'w',encoding='utf-8') as f: f.write(c)
          print('✅ apktool.yml patched')
          PYEOF
          python3 /tmp/fix_yml.py "$YML" \
            "${{ env.OLD_PACKAGE }}" "${{ env.NEW_PACKAGE }}"
          grep -iE "package|rename" "$YML" || true

      # ═══════════════════════════════════════════════
      # 9. FIX PROVIDER AUTHORITIES
      # ═══════════════════════════════════════════════
      - name: Fix Provider Authorities
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          cat > /tmp/fix_prov.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys, re
          path, old, new = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path,'r',encoding='utf-8') as f: c = f.read()
          pat = r'(android:authorities=")([^"]*'+re.escape(old)+r'[^"]*)(")'
          c,n  = re.subn(pat, lambda m: m.group(1)+m.group(2).replace(old,new)+m.group(3), c)
          hp   = r'(android:host=")('+re.escape(old)+r')(")' 
          c,nh = re.subn(hp, lambda m: m.group(1)+new+m.group(3), c)
          with open(path,'w',encoding='utf-8') as f: f.write(c)
          print(f'✅ Fixed {n} authorities, {nh} hosts')
          PYEOF
          python3 /tmp/fix_prov.py \
            "$MANIFEST" "${{ env.OLD_PACKAGE }}" "${{ env.NEW_PACKAGE }}"

      # ═══════════════════════════════════════════════
      # 10. FIX res/ AND assets/
      # ═══════════════════════════════════════════════
      - name: Fix res/ and assets/
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"
          find "$DIR/res"    -name "*.xml" 2>/dev/null | xargs -r sed -i "s|${OLD}|${NEW}|g"
          find "$DIR/assets" -type f       2>/dev/null | \
            xargs -r grep -rl "$OLD" 2>/dev/null | \
            while read f; do
              file "$f" | grep -qiE 'text|json|xml|ascii' && \
                sed -i "s|${OLD}|${NEW}|g" "$f"
            done
          echo "✅ res/ & assets/ fixed"

      # ═══════════════════════════════════════════════
      # 11. DEEP SMALI FIX
      # ═══════════════════════════════════════════════
      - name: Deep Smali Fix
        run: |
          cat > /tmp/fix_smali.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys, re
          old, new, root = sys.argv[1], sys.argv[2], sys.argv[3]
          os2 = old.replace('.','/')
          ns2 = new.replace('.','/')
          dp  = re.compile(re.escape(old)) if not new.startswith(old) else \
                re.compile(re.escape(old)+r'(?!'+re.escape(new[len(old):])+r')')
          sp  = re.compile(re.escape(os2)) if not ns2.startswith(os2) else \
                re.compile(re.escape(os2)+r'(?!'+re.escape(ns2[len(os2):])+r')')
          chg = 0
          for d,_,fs in os.walk(root):
              for fn in fs:
                  if not fn.endswith('.smali'): continue
                  fp = os.path.join(d,fn)
                  try:
                      with open(fp,'r',encoding='utf-8',errors='replace') as f: lines=f.readlines()
                  except: continue
                  nl=[]; dirty=False
                  for line in lines:
                      l2=sp.sub(ns2,line); l2=dp.sub(new,l2)
                      if l2!=line: dirty=True
                      nl.append(l2)
                  if dirty:
                      chg+=1
                      with open(fp,'w',encoding='utf-8') as f: f.writelines(nl)
          print(f'✅ Smali deep fix: {chg} files')
          PYEOF
          python3 /tmp/fix_smali.py \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}" \
            "${{ github.event.inputs.decompiled_folder }}"

      # ═══════════════════════════════════════════════
      # 12. RENAME SMALI DIRECTORIES
      # ═══════════════════════════════════════════════
      - name: Rename Smali Directories
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PATH=$(echo "${{ env.OLD_PACKAGE }}" | tr '.' '/')
          NEW_PATH=$(echo "${{ env.NEW_PACKAGE }}" | tr '.' '/')
          cat > /tmp/rename_dirs.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys, shutil
          op, np, root = sys.argv[1], sys.argv[2], sys.argv[3]
          moved = 0
          for sd in os.listdir(root):
              if not sd.startswith('smali'): continue
              sr = os.path.join(root,sd)
              if not os.path.isdir(sr): continue
              of = os.path.join(sr,op); nf = os.path.join(sr,np)
              if os.path.isdir(of):
                  os.makedirs(os.path.dirname(nf),exist_ok=True)
                  if os.path.exists(nf):
                      for item in os.listdir(of):
                          s=os.path.join(of,item); d=os.path.join(nf,item)
                          if not os.path.exists(d): shutil.move(s,d)
                      shutil.rmtree(of,ignore_errors=True)
                  else: shutil.move(of,nf)
                  moved+=1; print(f'  Moved: {of}')
          for sd in os.listdir(root):
              if not sd.startswith('smali'): continue
              sr=os.path.join(root,sd)
              for dp,dn,fn in os.walk(sr,topdown=False):
                  if not fn and not os.listdir(dp):
                      try: os.rmdir(dp)
                      except: pass
          print(f'✅ Renamed {moved} dir(s)')
          PYEOF
          python3 /tmp/rename_dirs.py "$OLD_PATH" "$NEW_PATH" "$DECOMPILED_DIR"

      # ═══════════════════════════════════════════════
      # 13. PATCH .so NATIVE LIBRARIES
      # ═══════════════════════════════════════════════
      - name: Patch Native .so Libraries
        run: |
          cat > /tmp/patch_so.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys
          old=sys.argv[1].encode(); new=sys.argv[2].encode(); root=sys.argv[3]
          if len(new)>len(old):
              print('⚠️  New pkg longer — .so patch SKIPPED'); sys.exit(0)
          padded=new+b'\x00'*(len(old)-len(new)); patched=0
          for dp,_,fs in os.walk(root):
              for fn in fs:
                  if not fn.endswith('.so'): continue
                  fp=os.path.join(dp,fn)
                  try:
                      with open(fp,'rb') as f: data=f.read()
                  except: continue
                  if old not in data: continue
                  with open(fp,'wb') as f: f.write(data.replace(old,padded))
                  patched+=1; print(f'  Patched: {fn}')
          print(f'✅ .so patch: {patched} files')
          PYEOF
          python3 /tmp/patch_so.py \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}" \
            "${{ github.event.inputs.decompiled_folder }}"

      # ═══════════════════════════════════════════════
      # 14. ██ CRASH REPORTER INJECTION ██
      #
      #  কিভাবে কাজ করে:
      #  ┌─────────────────────────────────────────┐
      #  │ App crash হলে CrashHandler ধরবে        │
      #  │ → CrashReporterActivity খুলবে          │
      #  │ → Screen এ full error দেখাবে           │
      #  │ → Text selectable — কপি করা যাবে      │
      #  └─────────────────────────────────────────┘
      # ═══════════════════════════════════════════════
      - name: Inject CrashReporter (smali files)
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          NEW="${{ env.NEW_PACKAGE }}"
          NS=$(echo "$NEW" | tr '.' '/')

          # Find first smali dir
          SMALI_DIR=""
          for d in "$DIR/smali" "$DIR/smali_classes2" "$DIR/smali_classes3"; do
            [ -d "$d" ] && SMALI_DIR="$d" && break
          done
          [ -z "$SMALI_DIR" ] && SMALI_DIR=$(find "$DIR" -maxdepth 1 -type d -name "smali*" | sort | head -1)
          [ -z "$SMALI_DIR" ] && { echo "❌ No smali dir!"; exit 1; }
          echo "Smali dir: $SMALI_DIR"

          PKG_DIR="$SMALI_DIR/$NS/crashreporter"
          mkdir -p "$PKG_DIR"

          # ── CrashReporterActivity.smali ──────────────
          cat > "$PKG_DIR/CrashReporterActivity.smali" << SMEOF
.class public L${NS}/crashreporter/CrashReporterActivity;
.super Landroid/app/Activity;
.source "CrashReporterActivity.java"

.method public constructor <init>()V
    .registers 1
    invoke-direct {p0}, Landroid/app/Activity;-><init>()V
    return-void
.end method

.method protected onCreate(Landroid/os/Bundle;)V
    .registers 12

    invoke-super {p0, p1}, Landroid/app/Activity;->onCreate(Landroid/os/Bundle;)V

    invoke-virtual {p0}, Landroid/app/Activity;->getIntent()Landroid/content/Intent;
    move-result-object v0

    const-string v1, "crash_message"
    invoke-virtual {v0, v1}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
    move-result-object v1

    const-string v2, "crash_stacktrace"
    invoke-virtual {v0, v2}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
    move-result-object v2

    const-string v3, "crash_thread"
    invoke-virtual {v0, v3}, Landroid/content/Intent;->getStringExtra(Ljava/lang/String;)Ljava/lang/String;
    move-result-object v3

    # Build report string
    new-instance v4, Ljava/lang/StringBuilder;
    invoke-direct {v4}, Ljava/lang/StringBuilder;-><init>()V

    const-string v5, "====== CRASH REPORT ======\n\nERROR:\n"
    invoke-virtual {v4, v5}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    invoke-virtual {v4, v1}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    const-string v5, "\n\nTHREAD: "
    invoke-virtual {v4, v5}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    invoke-virtual {v4, v3}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    const-string v5, "\n\nSTACKTRACE:\n"
    invoke-virtual {v4, v5}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    invoke-virtual {v4, v2}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    const-string v5, "\n\n===== কপি করে পাঠান ====="
    invoke-virtual {v4, v5}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    invoke-virtual {v4}, Ljava/lang/StringBuilder;->toString()Ljava/lang/String;
    move-result-object v4

    # Root layout
    new-instance v5, Landroid/widget/LinearLayout;
    invoke-direct {v5, p0}, Landroid/widget/LinearLayout;-><init>(Landroid/content/Context;)V
    const/4 v6, 0x1
    invoke-virtual {v5, v6}, Landroid/widget/LinearLayout;->setOrientation(I)V
    const v6, 0xFF0D0D0D
    invoke-virtual {v5, v6}, Landroid/widget/LinearLayout;->setBackgroundColor(I)V
    const/16 v6, 0x30
    invoke-virtual {v5, v6, v6, v6, v6}, Landroid/widget/LinearLayout;->setPadding(IIII)V

    # Header TextView
    new-instance v6, Landroid/widget/TextView;
    invoke-direct {v6, p0}, Landroid/widget/TextView;-><init>(Landroid/content/Context;)V
    const-string v7, "CRASH REPORT - নিচের লেখা কপি করুন"
    invoke-virtual {v6, v7}, Landroid/widget/TextView;->setText(Ljava/lang/CharSequence;)V
    const v7, 0xFFFF3333
    invoke-virtual {v6, v7}, Landroid/widget/TextView;->setTextColor(I)V
    const v7, 0x41980000
    invoke-virtual {v6, v7}, Landroid/widget/TextView;->setTextSize(F)V
    const/4 v7, 0x1
    invoke-virtual {v6, v7}, Landroid/widget/TextView;->setPadding(I)V

    new-instance v7, Landroid/widget/LinearLayout$LayoutParams;
    const/4 v8, -1
    const/4 v9, -2
    invoke-direct {v7, v8, v9}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V
    invoke-virtual {v5, v6, v7}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V

    # ScrollView
    new-instance v7, Landroid/widget/ScrollView;
    invoke-direct {v7, p0}, Landroid/widget/ScrollView;-><init>(Landroid/content/Context;)V

    # Error TextView
    new-instance v8, Landroid/widget/TextView;
    invoke-direct {v8, p0}, Landroid/widget/TextView;-><init>(Landroid/content/Context;)V
    invoke-virtual {v8, v4}, Landroid/widget/TextView;->setText(Ljava/lang/CharSequence;)V
    const v9, 0xFFEEEEEE
    invoke-virtual {v8, v9}, Landroid/widget/TextView;->setTextColor(I)V
    const v9, 0x41600000
    invoke-virtual {v8, v9}, Landroid/widget/TextView;->setTextSize(F)V
    const/4 v9, 0x1
    invoke-virtual {v8, v9}, Landroid/widget/TextView;->setTextIsSelectable(Z)V

    invoke-virtual {v7, v8}, Landroid/widget/ScrollView;->addView(Landroid/view/View;)V

    new-instance v9, Landroid/widget/LinearLayout$LayoutParams;
    const/4 v10, -1
    const/4 v11, 0
    invoke-direct {v9, v10, v11}, Landroid/widget/LinearLayout$LayoutParams;-><init>(II)V
    invoke-virtual {v5, v7, v9}, Landroid/widget/LinearLayout;->addView(Landroid/view/View;Landroid/view/ViewGroup$LayoutParams;)V

    invoke-virtual {p0, v5}, Landroid/app/Activity;->setContentView(Landroid/view/View;)V

    const-string v10, "CrashReporter"
    invoke-static {v10, v4}, Landroid/util/Log;->e(Ljava/lang/String;Ljava/lang/String;)I

    return-void
.end method

.method public onBackPressed()V
    .registers 1
    return-void
.end method
SMEOF

          # ── CrashHandler.smali ────────────────────────
          cat > "$PKG_DIR/CrashHandler.smali" << SMEOF
.class public L${NS}/crashreporter/CrashHandler;
.super Ljava/lang/Object;
.implements Ljava/lang/Thread\$UncaughtExceptionHandler;
.source "CrashHandler.java"

.field private context:Landroid/content/Context;

.method public constructor <init>(Landroid/content/Context;)V
    .registers 2
    invoke-direct {p0}, Ljava/lang/Object;-><init>()V
    iput-object p1, p0, L${NS}/crashreporter/CrashHandler;->context:Landroid/content/Context;
    return-void
.end method

.method public static install(Landroid/content/Context;)V
    .registers 2
    new-instance v0, L${NS}/crashreporter/CrashHandler;
    invoke-direct {v0, p0}, L${NS}/crashreporter/CrashHandler;-><init>(Landroid/content/Context;)V
    invoke-static {v0}, Ljava/lang/Thread;->setDefaultUncaughtExceptionHandler(Ljava/lang/Thread\$UncaughtExceptionHandler;)V
    return-void
.end method

.method public uncaughtException(Ljava/lang/Thread;Ljava/lang/Throwable;)V
    .registers 12

    # Thread name
    invoke-virtual {p1}, Ljava/lang/Thread;->getName()Ljava/lang/String;
    move-result-object v0

    # Error message
    invoke-virtual {p2}, Ljava/lang/Throwable;->toString()Ljava/lang/String;
    move-result-object v1

    # Stacktrace
    new-instance v2, Ljava/io/StringWriter;
    invoke-direct {v2}, Ljava/io/StringWriter;-><init>()V
    new-instance v3, Ljava/io/PrintWriter;
    invoke-direct {v3, v2}, Ljava/io/PrintWriter;-><init>(Ljava/io/Writer;)V
    invoke-virtual {p2, v3}, Ljava/lang/Throwable;->printStackTrace(Ljava/io/PrintWriter;)V
    invoke-virtual {v3}, Ljava/io/PrintWriter;->flush()V
    invoke-virtual {v2}, Ljava/io/StringWriter;->toString()Ljava/lang/String;
    move-result-object v4

    # Caused by
    invoke-virtual {p2}, Ljava/lang/Throwable;->getCause()Ljava/lang/Throwable;
    move-result-object v5
    if-eqz v5, :no_cause
    new-instance v6, Ljava/lang/StringBuilder;
    invoke-direct {v6}, Ljava/lang/StringBuilder;-><init>()V
    invoke-virtual {v6, v4}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    const-string v7, "\n\nCAUSED BY: "
    invoke-virtual {v6, v7}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    invoke-virtual {v5}, Ljava/lang/Throwable;->toString()Ljava/lang/String;
    move-result-object v7
    invoke-virtual {v6, v7}, Ljava/lang/StringBuilder;->append(Ljava/lang/String;)Ljava/lang/StringBuilder;
    invoke-virtual {v6}, Ljava/lang/StringBuilder;->toString()Ljava/lang/String;
    move-result-object v4
    :no_cause

    iget-object v6, p0, L${NS}/crashreporter/CrashHandler;->context:Landroid/content/Context;

    new-instance v7, Landroid/content/Intent;
    const-class v8, L${NS}/crashreporter/CrashReporterActivity;
    invoke-direct {v7, v6, v8}, Landroid/content/Intent;-><init>(Landroid/content/Context;Ljava/lang/Class;)V

    const v8, 0x10008000
    invoke-virtual {v7, v8}, Landroid/content/Intent;->setFlags(I)Landroid/content/Intent;

    const-string v8, "crash_message"
    invoke-virtual {v7, v8, v1}, Landroid/content/Intent;->putExtra(Ljava/lang/String;Ljava/lang/String;)Landroid/content/Intent;
    const-string v8, "crash_stacktrace"
    invoke-virtual {v7, v8, v4}, Landroid/content/Intent;->putExtra(Ljava/lang/String;Ljava/lang/String;)Landroid/content/Intent;
    const-string v8, "crash_thread"
    invoke-virtual {v7, v8, v0}, Landroid/content/Intent;->putExtra(Ljava/lang/String;Ljava/lang/String;)Landroid/content/Intent;

    invoke-virtual {v6, v7}, Landroid/content/Context;->startActivity(Landroid/content/Intent;)V

    const-string v8, "CrashReporter"
    invoke-static {v8, v1, p2}, Landroid/util/Log;->e(Ljava/lang/String;Ljava/lang/String;Ljava/lang/Throwable;)I

    # Small delay so activity starts
    const-wide/16 v9, 0x7D0
    invoke-static {v9, v10}, Ljava/lang/Thread;->sleep(J)V

    return-void
.end method
SMEOF

          echo "✅ CrashReporter smali files written:"
          ls -la "$PKG_DIR/"

      # ═══════════════════════════════════════════════
      # 15. REGISTER CrashReporterActivity IN MANIFEST
      # ═══════════════════════════════════════════════
      - name: Register CrashReporterActivity in Manifest
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          NEW="${{ env.NEW_PACKAGE }}"
          cat > /tmp/reg_crash.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys
          path, new = sys.argv[1], sys.argv[2]
          entry = (
              f'\n        <activity\n'
              f'            android:name="{new}.crashreporter.CrashReporterActivity"\n'
              f'            android:exported="false"\n'
              f'            android:excludeFromRecents="true"\n'
              f'            android:taskAffinity="{new}.crash"\n'
              f'            android:launchMode="singleTask"\n'
              f'            android:theme="@android:style/Theme.NoTitleBar" />'
          )
          with open(path,'r',encoding='utf-8') as f: c = f.read()
          if 'CrashReporterActivity' in c:
              print('✅ Already registered'); sys.exit(0)
          if '</application>' not in c:
              print('❌ </application> not found'); sys.exit(1)
          c = c.replace('</application>', entry + '\n    </application>', 1)
          with open(path,'w',encoding='utf-8') as f: f.write(c)
          print('✅ CrashReporterActivity registered in manifest')
          PYEOF
          python3 /tmp/reg_crash.py "$MANIFEST" "$NEW"
          grep -n "CrashReporter" "$MANIFEST" || echo "❌ NOT found!"

      # ═══════════════════════════════════════════════
      # 16. HOOK CrashHandler INTO Application.onCreate
      # ═══════════════════════════════════════════════
      - name: Hook CrashHandler into Application.onCreate
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          NEW="${{ env.NEW_PACKAGE }}"
          NS=$(echo "$NEW" | tr '.' '/')

          cat > /tmp/hook_app.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Finds Application subclass onCreate() and injects
          CrashHandler.install(this) as first call after super.onCreate().
          """
          import os, sys, re

          new  = sys.argv[1]
          ns   = new.replace('.','/')
          root = sys.argv[2]

          INSTALL = (
              f'\n    invoke-static {{p0}}, L{ns}/crashreporter/CrashHandler;'
              f'->install(Landroid/content/Context;)V\n'
          )

          APP_SUPERS = [
              'Landroid/app/Application;',
              'Landroid/support/multidex/MultiDexApplication;',
              'Landroidx/multidex/MultiDexApplication;',
          ]
          PRIORITY = ['applicationloader','application','app','baseapplication','myapp']

          def find_oncreate_block(content):
              return bool(re.search(
                  r'\.method\s+public\s+onCreate\s*\(\s*\)\s*V', content))

          def inject(content):
              pat = re.compile(
                  r'(\.method\s+public\s+onCreate\s*\(\s*\)\s*V.*?)(\.end method)',
                  re.DOTALL)
              m = pat.search(content)
              if not m: return content, False
              body = m.group(1)
              # After first invoke-super or after .registers
              sm = re.search(r'(invoke-super\s+\{[^}]*\}[^\n]*\n)', body)
              if sm:
                  pos = m.start(1) + sm.end()
              else:
                  rm = re.search(r'(\.registers\s+\d+\n)', body)
                  if not rm: return content, False
                  pos = m.start(1) + rm.end()
              return content[:pos] + INSTALL + content[pos:], True

          candidates = []
          for dp,_,fs in os.walk(root):
              for fn in fs:
                  if not fn.endswith('.smali'): continue
                  fp = os.path.join(dp,fn)
                  try:
                      with open(fp,'r',encoding='utf-8',errors='replace') as f:
                          c = f.read()
                  except: continue
                  if not any(s in c for s in APP_SUPERS): continue
                  if not find_oncreate_block(c): continue
                  if 'CrashHandler' in c: print(f'Already hooked: {fn}'); continue
                  prio = 99
                  base = fn.replace('.smali','').lower()
                  for i,nm in enumerate(PRIORITY):
                      if nm in base: prio=i; break
                  candidates.append((prio, fp, c))

          if not candidates:
              print('⚠️  No Application.onCreate() found to hook!')
              sys.exit(0)

          candidates.sort(key=lambda x: x[0])
          prio, fp, c = candidates[0]
          new_c, ok = inject(c)
          if ok:
              with open(fp,'w',encoding='utf-8') as f: f.write(new_c)
              print(f'✅ Hooked into: {fp}')
              print(f'   Candidates checked: {len(candidates)}')
          else:
              print(f'❌ Injection failed in {fp}')
          PYEOF
          python3 /tmp/hook_app.py "$NEW" "$DIR"

      # ═══════════════════════════════════════════════
      # 17. VERIFY INJECTION
      # ═══════════════════════════════════════════════
      - name: Verify CrashReporter Injection
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          NEW="${{ env.NEW_PACKAGE }}"

          echo "── CrashReporter smali files ──"
          find "$DIR" -path "*crashreporter*" -name "*.smali" | \
            while read f; do echo "  ✅ $f ($(wc -l < $f) lines)"; done

          echo ""
          echo "── Manifest entry ──"
          grep -n "CrashReporter" "$DIR/AndroidManifest.xml" || echo "  ❌ MISSING"

          echo ""
          echo "── Hook in Application class ──"
          grep -rn "CrashHandler" "$DIR" --include="*.smali" | \
            grep -v "crashreporter/" | head -5 || echo "  ⚠️  No hook found"

      # ═══════════════════════════════════════════════
      # 18. FINAL VERIFY
      # ═══════════════════════════════════════════════
      - name: Final Rename Verification
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          echo "════════════════════════════"
          OC=$(grep -c "$OLD" "$DIR/AndroidManifest.xml" 2>/dev/null || echo 0)
          echo "Manifest old pkg : $OC (want 0)"
          SC=$(grep -rl "$OLD" "$DIR" --include="*.smali" 2>/dev/null | wc -l)
          echo "Smali old pkg    : $SC (want 0)"
          grep -n "requiredSplitTypes" "$DIR/AndroidManifest.xml" \
            && echo "⚠️  requiredSplitTypes present" || echo "requiredSplitTypes : ✅ clean"
          echo "════════════════════════════"

      # ═══════════════════════════════════════════════
      # 19. RECOMPILE APK
      # ═══════════════════════════════════════════════
      - name: Recompile APK
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OUT="recompiled_unsigned.apk"
          build(){ local l="$1"; shift
            echo "═══ $l ═══"
            apktool b "$DIR" -o "$OUT" -f "$@" 2>&1 && \
              { echo "✅ SUCCESS"; return 0; } || { echo "⚠️ FAILED"; return 1; }
          }
          rm -f "$OUT"
          build "default" \
            || build "aapt2"        --use-aapt2 \
            || build "aapt2+nc"     --use-aapt2 --no-crunch \
            || build "aapt2+nc+ns"  --use-aapt2 --no-crunch --no-src \
            || { echo "❌ All builds failed!"; exit 1; }
          ls -lh "$OUT"

      # ═══════════════════════════════════════════════
      # 20. VERIFY APK (CrashReporter present?)
      # ═══════════════════════════════════════════════
      - name: Verify APK Structure
        run: |
          aapt2 dump badging recompiled_unsigned.apk 2>&1 | head -5 || true
          aapt dump badging recompiled_unsigned.apk 2>/dev/null | grep "^package:" || true
          echo "── CrashReporter in APK ──"
          unzip -l recompiled_unsigned.apk | grep -i crash \
            && echo "✅ CrashReporter found in APK" \
            || echo "⚠️  CrashReporter NOT in APK — check smali dir"

      # ═══════════════════════════════════════════════
      # 21. GENERATE KEYSTORE
      # ═══════════════════════════════════════════════
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore -alias w4baes \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass w4baes123 -keypass w4baes123 \
            -dname "CN=W4BAES,OU=Dev,O=W4BAES,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt && echo "✅ Keystore done"

      # ═══════════════════════════════════════════════
      # 22. ZIPALIGN
      # ═══════════════════════════════════════════════
      - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          zipalign -c -v 4 aligned.apk && echo "✅ Aligned" || echo "⚠️ warn"

      # ═══════════════════════════════════════════════
      # 23. SIGN
      # ═══════════════════════════════════════════════
      - name: Sign APK
        run: |
          apksigner sign \
            --ks my.keystore --ks-pass pass:w4baes123 \
            --key-pass pass:w4baes123 --ks-key-alias w4baes \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out signed_app.apk aligned.apk
          apksigner verify --verbose --print-certs signed_app.apk \
            && echo "✅ Signed OK" || { echo "❌ Sign FAILED"; exit 1; }
          ls -lh signed_app.apk

      # ═══════════════════════════════════════════════
      # 24. UPLOAD ARTIFACT
      # ═══════════════════════════════════════════════
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-debug-apk
          path: signed_app.apk
          retention-days: 90

      # ═══════════════════════════════════════════════
      # 25. CREATE RELEASE
      # ═══════════════════════════════════════════════
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: tg-debug-v1.0.${{ github.run_number }}
          name: "Telegram Debug Build #${{ github.run_number }}"
          body: |
            ## Telegram Debug Build #${{ github.run_number }}

            | Field       | Value                       |
            |-------------|-----------------------------|
            | New Package | `${{ env.NEW_PACKAGE }}`    |
            | Old Package | `${{ env.OLD_PACKAGE }}`    |
            | Build       | `#${{ github.run_number }}` |
            | Signing     | v1 + v2 + v3                |

            ### 🐛 CrashReporter যুক্ত আছে
            - App open করুন
            - Crash হলে **লাল screen** দেখাবে
            - Screen এর সব লেখা **long-press করে কপি** করুন
            - কপি করা text পাঠান

          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

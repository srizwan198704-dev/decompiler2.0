name: Telegram

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'
      new_package:
        description: 'New package name'
        required: true
        default: 'com.konasl.nagad'
      debug_mode:
        description: 'Enable verbose debug output'
        required: false
        default: 'false'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # ─────────────────────────────────────────────
      # 1. CHECKOUT
      # ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v3
        with:
          lfs: true

      # ─────────────────────────────────────────────
      # 2. JAVA + BASE TOOLS
      # ─────────────────────────────────────────────
      - name: Setup Java & Base Tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            openjdk-17-jre-headless \
            zipalign \
            wget \
            unzip \
            python3 \
            python3-lxml \
            aapt \
            libxml2-utils \
            binutils \
            file \
            findutils \
            grep \
            sed \
            coreutils \
            patchelf
          java -version
          python3 --version

      # ─────────────────────────────────────────────
      # 3. ANDROID SDK + BUILD TOOLS
      # ─────────────────────────────────────────────
      - name: Setup Android SDK
        run: |
          wget -q \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
            -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools \
                  /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          for tool in aapt2 apksigner zipalign aapt d8; do
            sudo ln -sf /opt/android-sdk/build-tools/34.0.0/$tool \
                        /usr/local/bin/$tool 2>/dev/null || true
          done
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk"   >> $GITHUB_ENV
          aapt2 version
          apksigner version

      # ─────────────────────────────────────────────
      # 4. APKTOOL
      # ─────────────────────────────────────────────
      - name: Setup APKTool
        run: |
          sudo wget -q \
            https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      # ─────────────────────────────────────────────
      # 5. DETECT ORIGINAL PACKAGE NAME
      # ─────────────────────────────────────────────
      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          NEW_PKG="${{ github.event.inputs.new_package }}"
          OLD_PACKAGE=""

          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' \
              "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi

          if [ -z "$OLD_PACKAGE" ] && [ -f "$DECOMPILED_DIR/apktool.yml" ]; then
            OLD_PACKAGE=$(grep -oP 'packageId:\s*\K\S+' \
              "$DECOMPILED_DIR/apktool.yml" | head -1)
          fi

          if [ -z "$OLD_PACKAGE" ]; then
            SMALI_DIR=$(find "$DECOMPILED_DIR" -maxdepth 1 -type d -name "smali*" | head -1)
            if [ -n "$SMALI_DIR" ]; then
              OLD_PACKAGE=$(find "$SMALI_DIR" -name "*.smali" | head -1 | \
                xargs grep -oP '\.class\s+\S+\s+\K\S+' 2>/dev/null | \
                head -1 | tr '/' '.' | sed 's/\.[A-Z].*//' || echo "")
            fi
          fi

          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="org.telegram.messenger"
          fi

          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "NEW_PACKAGE=$NEW_PKG"     >> $GITHUB_ENV
          echo "✅ Old package : $OLD_PACKAGE"
          echo "✅ New package : $NEW_PKG"

      # ─────────────────────────────────────────────
      # 6. FULL PACKAGE RENAME — all text files
      # ─────────────────────────────────────────────
      - name: Full Package Rename
        run: |
          cat > /tmp/rename_pkg.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys, re

          old  = sys.argv[1]
          new  = sys.argv[2]
          root = sys.argv[3]

          old_slash = old.replace('.', '/')
          new_slash = new.replace('.', '/')

          TEXT_EXTS = {
            '.xml', '.smali', '.properties', '.yml', '.yaml',
            '.json', '.gradle', '.kt', '.java', '.html', '.txt',
            '.cfg', '.ini', '.conf', '.plist', '.mf', '.sf',
          }

          if new.startswith(old):
              sfx     = re.escape(new[len(old):])
              dot_pat = re.compile(re.escape(old) + r'(?!' + sfx + r')')
          else:
              dot_pat = re.compile(re.escape(old))

          stats = {'files': 0}

          def replace_in_file(path):
              try:
                  with open(path, 'r', encoding='utf-8', errors='replace') as f:
                      content = f.read()
              except Exception:
                  return
              original = content
              content  = content.replace(old_slash, new_slash)
              content  = dot_pat.sub(new, content)
              if content != original:
                  with open(path, 'w', encoding='utf-8') as f:
                      f.write(content)
                  stats['files'] += 1

          for dirpath, dirnames, filenames in os.walk(root):
              dirnames[:] = [d for d in dirnames if d not in ('META-INF',)]
              for fname in filenames:
                  if os.path.splitext(fname)[1].lower() in TEXT_EXTS:
                      replace_in_file(os.path.join(dirpath, fname))

          print(f"✅ Renamed package in {stats['files']} files")
          PYEOF
          python3 /tmp/rename_pkg.py \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}" \
            "${{ github.event.inputs.decompiled_folder }}"

      # ─────────────────────────────────────────────
      # 7. FIX AndroidManifest.xml
      # ─────────────────────────────────────────────
      - name: Fix AndroidManifest.xml Attributes
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          cat > /tmp/fix_manifest.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys, re

          path = sys.argv[1]
          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          fixes = []

          # Remove requiredSplitTypes
          if 'requiredSplitTypes' in content:
              content = re.sub(r'\s+android:requiredSplitTypes="[^"]*"', '', content)
              content = re.sub(r'\s+requiredSplitTypes="[^"]*"',         '', content)
              fixes.append('removed requiredSplitTypes')

          # Remove dangling isSplitRequired
          if 'isSplitRequired' in content and 'requiredSplitTypes' not in content:
              content = re.sub(r'\s+android:isSplitRequired="[^"]*"', '', content)
              fixes.append('removed dangling isSplitRequired')

          # Remove compileSdkVersion / compileSdkVersionCodename
          for attr in ('compileSdkVersion', 'compileSdkVersionCodename'):
              pattern = r'\s+android:' + re.escape(attr) + r'="[^"]*"'
              if re.search(pattern, content):
                  content = re.sub(pattern, '', content)
                  fixes.append(f'removed {attr}')

          # Deduplicate package attribute
          manifest_tag_match = re.search(r'<manifest\b[^>]*>', content, re.DOTALL)
          if manifest_tag_match:
              tag = manifest_tag_match.group(0)
              pkg_matches = re.findall(r'package="[^"]+"', tag)
              if len(pkg_matches) > 1:
                  seen = [False]
                  def dedup(m):
                      if not seen[0]:
                          seen[0] = True
                          return m.group(0)
                      return ''
                  new_tag = re.sub(r'package="[^"]+"', dedup, tag)
                  content = content.replace(tag, new_tag, 1)
                  fixes.append('deduplicated package attribute')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)

          print('✅ Manifest fixes:', ', '.join(fixes) if fixes else 'none needed')
          PYEOF
          python3 /tmp/fix_manifest.py "$MANIFEST"

      # ─────────────────────────────────────────────
      # 8. FIX apktool.yml
      # ─────────────────────────────────────────────
      - name: Fix apktool.yml
        run: |
          YML="${{ github.event.inputs.decompiled_folder }}/apktool.yml"
          [ ! -f "$YML" ] && echo "apktool.yml not found, skipping" && exit 0

          cat > /tmp/fix_yml.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys, re

          path = sys.argv[1]
          old  = sys.argv[2]
          new  = sys.argv[3]

          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          content = content.replace(old, new)

          if 'renameManifestPackage:' in content:
              content = re.sub(
                  r'renameManifestPackage:\s*\S*',
                  f'renameManifestPackage: {new}', content)
          else:
              lines = content.split('\n')
              insert_at = 1
              for i, l in enumerate(lines):
                  if l.startswith('apkFileName') or l.startswith('isFrameworkApk'):
                      insert_at = i
                      break
              lines.insert(insert_at, f'renameManifestPackage: {new}')
              content = '\n'.join(lines)

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          print('✅ apktool.yml patched')
          PYEOF
          python3 /tmp/fix_yml.py "$YML" \
            "${{ env.OLD_PACKAGE }}" "${{ env.NEW_PACKAGE }}"
          grep -iE "package|rename|version|isFramework" "$YML" || true

      # ─────────────────────────────────────────────
      # 9. FIX PROVIDER AUTHORITIES
      # ─────────────────────────────────────────────
      - name: Fix Provider Authorities & Intent Filters
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          cat > /tmp/fix_providers.py << 'PYEOF'
          #!/usr/bin/env python3
          import sys, re

          path = sys.argv[1]
          old  = sys.argv[2]
          new  = sys.argv[3]

          with open(path, 'r', encoding='utf-8') as f:
              content = f.read()

          pattern = r'(android:authorities=")([^"]*' + re.escape(old) + r'[^"]*)(")'
          def fix_auth(m):
              return m.group(1) + m.group(2).replace(old, new) + m.group(3)
          content, n = re.subn(pattern, fix_auth, content)
          print(f'✅ Fixed {n} provider authority reference(s)')

          host_pat = r'(android:host=")(' + re.escape(old) + r')(")'
          content, nh = re.subn(host_pat,
              lambda m: m.group(1) + new + m.group(3), content)
          if nh:
              print(f'✅ Fixed {nh} intent-filter host reference(s)')

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF
          python3 /tmp/fix_providers.py \
            "$MANIFEST" "${{ env.OLD_PACKAGE }}" "${{ env.NEW_PACKAGE }}"

      # ─────────────────────────────────────────────
      # 10. FIX res/xml
      # ─────────────────────────────────────────────
      - name: Fix res/xml FileProvider descriptors
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"
          find "$DIR/res/xml" -name "*.xml" 2>/dev/null | \
            xargs -r sed -i "s|${OLD}|${NEW}|g"
          echo "✅ res/xml fixed"

      # ─────────────────────────────────────────────
      # 11. DEEP SMALI FIX
      # ─────────────────────────────────────────────
      - name: Deep Smali Fix
        run: |
          cat > /tmp/fix_smali_deep.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys, re

          old  = sys.argv[1]
          new  = sys.argv[2]
          root = sys.argv[3]

          old_slash = old.replace('.', '/')
          new_slash = new.replace('.', '/')

          if new.startswith(old):
              sfx       = re.escape(new[len(old):])
              dot_pat   = re.compile(re.escape(old)       + r'(?!' + sfx + r')')
          else:
              dot_pat   = re.compile(re.escape(old))

          if new_slash.startswith(old_slash):
              sfx2      = re.escape(new_slash[len(old_slash):])
              slash_pat = re.compile(re.escape(old_slash) + r'(?!' + sfx2 + r')')
          else:
              slash_pat = re.compile(re.escape(old_slash))

          changed_files = 0

          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if not fname.endswith('.smali'):
                      continue
                  fpath = os.path.join(dirpath, fname)
                  try:
                      with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                          lines = f.readlines()
                  except Exception:
                      continue
                  new_lines     = []
                  file_changed  = False
                  for line in lines:
                      nl = slash_pat.sub(new_slash, line)
                      nl = dot_pat.sub(new, nl)
                      if nl != line:
                          file_changed = True
                      new_lines.append(nl)
                  if file_changed:
                      changed_files += 1
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.writelines(new_lines)

          print(f'✅ Deep smali fix: {changed_files} files updated')
          PYEOF
          python3 /tmp/fix_smali_deep.py \
            "${{ env.OLD_PACKAGE }}" \
            "${{ env.NEW_PACKAGE }}" \
            "${{ github.event.inputs.decompiled_folder }}"

      # ─────────────────────────────────────────────
      # 12. RENAME SMALI DIRECTORIES
      # ─────────────────────────────────────────────
      - name: Rename Smali Directory Paths
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PATH=$(echo "${{ env.OLD_PACKAGE }}" | tr '.' '/')
          NEW_PATH=$(echo "${{ env.NEW_PACKAGE }}" | tr '.' '/')

          cat > /tmp/rename_dirs.py << 'PYEOF'
          #!/usr/bin/env python3
          import os, sys, shutil

          old_path = sys.argv[1]
          new_path = sys.argv[2]
          root     = sys.argv[3]

          moved = 0
          for smali_dir in os.listdir(root):
              if not smali_dir.startswith('smali'):
                  continue
              smali_root = os.path.join(root, smali_dir)
              if not os.path.isdir(smali_root):
                  continue
              old_full = os.path.join(smali_root, old_path)
              new_full = os.path.join(smali_root, new_path)
              if os.path.isdir(old_full):
                  os.makedirs(os.path.dirname(new_full), exist_ok=True)
                  if os.path.exists(new_full):
                      for item in os.listdir(old_full):
                          src = os.path.join(old_full, item)
                          dst = os.path.join(new_full, item)
                          if not os.path.exists(dst):
                              shutil.move(src, dst)
                      shutil.rmtree(old_full, ignore_errors=True)
                  else:
                      shutil.move(old_full, new_full)
                  moved += 1
                  print(f'  Moved: {old_full} -> {new_full}')

          for smali_dir in os.listdir(root):
              if not smali_dir.startswith('smali'):
                  continue
              smali_root = os.path.join(root, smali_dir)
              for dirpath, dirnames, filenames in os.walk(smali_root, topdown=False):
                  if not filenames and not os.listdir(dirpath):
                      try:
                          os.rmdir(dirpath)
                      except Exception:
                          pass

          print(f'✅ Renamed {moved} smali director(ies)')
          PYEOF
          python3 /tmp/rename_dirs.py \
            "$OLD_PATH" "$NEW_PATH" "$DECOMPILED_DIR"

      # ─────────────────────────────────────────────
      # 13. TELEGRAM-SPECIFIC: Fix ApplicationLoader
      #     & BuildConfig in smali
      # ─────────────────────────────────────────────
      - name: Fix Telegram ApplicationLoader & BuildConfig
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"
          OLD_SLASH=$(echo "$OLD" | tr '.' '/')
          NEW_SLASH=$(echo "$NEW" | tr '.' '/')

          cat > /tmp/fix_telegram_classes.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Telegram-specific fixes:
          1. ApplicationLoader.smali  — getPackageName(), APP_PACKAGE constant
          2. BuildConfig.smali        — APPLICATION_ID field value
          3. NotificationsController  — package-based notification channel IDs
          4. FileLoader / FilePathDatabase — package-specific cache paths
          5. Any smali with getPackageName() that returns old package as literal
          6. R.smali / R$*.smali      — packageName references
          """
          import os, sys, re

          old       = sys.argv[1]
          new       = sys.argv[2]
          root      = sys.argv[3]
          old_slash = old.replace('.', '/')
          new_slash = new.replace('.', '/')

          TARGET_CLASSES = [
              'ApplicationLoader',
              'BuildConfig',
              'NotificationsController',
              'FileLoader',
              'FilePathDatabase',
              'ApplicationLoaderUtil',
              'SharedConfig',
              'UserConfig',
              'MessagesController',
          ]

          # Pattern: const-string vX, "com.old.pkg..."
          str_pat = re.compile(
              r'(const-string(?:/jumbo)?\s+\w+,\s*")'
              + re.escape(old) +
              r'([^"]*")'
          )
          str_slash_pat = re.compile(
              r'(const-string(?:/jumbo)?\s+\w+,\s*")'
              + re.escape(old_slash) +
              r'([^"]*")'
          )

          # Pattern: .field ... = "com.old.pkg"
          field_pat = re.compile(
              r'(=\s*")'
              + re.escape(old) +
              r'([^"]*")'
          )

          fixed = 0
          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if not fname.endswith('.smali'):
                      continue

                  base = fname.replace('.smali', '')
                  is_target = any(t.lower() in base.lower() for t in TARGET_CLASSES)
                  fpath = os.path.join(dirpath, fname)

                  try:
                      with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                          content = f.read()
                  except Exception:
                      continue

                  original = content

                  # Always fix slash-form class references
                  content = content.replace(old_slash, new_slash)

                  # For target classes: fix ALL string literals
                  if is_target:
                      content = str_pat.sub(
                          lambda m: m.group(1) + new + m.group(2), content)
                      content = str_slash_pat.sub(
                          lambda m: m.group(1) + new_slash + m.group(2), content)
                      content = field_pat.sub(
                          lambda m: m.group(1) + new + m.group(2), content)
                  else:
                      # For all other smali: fix dotted string literals too
                      content = content.replace(old, new)

                  if content != original:
                      fixed += 1
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(content)

          print(f'✅ Telegram class fix: {fixed} files updated')
          PYEOF
          python3 /tmp/fix_telegram_classes.py "$OLD" "$NEW" "$DIR"

      # ─────────────────────────────────────────────
      # 14. TELEGRAM-SPECIFIC: Fix NativeLoader
      #     (Telegram loads .so by package path)
      # ─────────────────────────────────────────────
      - name: Fix Telegram NativeLoader smali
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"
          OLD_SLASH=$(echo "$OLD" | tr '.' '/')
          NEW_SLASH=$(echo "$NEW" | tr '.' '/')

          # Find NativeLoader.smali (may be in any smali_* dir)
          find "$DIR" -name "NativeLoader.smali" -o \
                      -name "NativeLibraryLoader.smali" 2>/dev/null | \
          while read -r f; do
            echo "Patching NativeLoader: $f"
            sed -i "s|${OLD_SLASH}|${NEW_SLASH}|g" "$f"
            sed -i "s|${OLD}|${NEW}|g" "$f"
          done

          # Also fix any smali referencing /data/data/OLD_PACKAGE
          find "$DIR" -name "*.smali" 2>/dev/null | \
            xargs -r grep -l "data/data/${OLD}" | \
          while read -r f; do
            echo "Patching data path in: $f"
            sed -i "s|data/data/${OLD}|data/data/${NEW}|g" "$f"
          done
          echo "✅ NativeLoader fix done"

      # ─────────────────────────────────────────────
      # 15. TELEGRAM-SPECIFIC: Fix SharedPreferences
      #     & Database file names in smali strings
      # ─────────────────────────────────────────────
      - name: Fix Telegram SharedPrefs & DB names
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"

          cat > /tmp/fix_prefs_db.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Fix hardcoded SharedPreferences file names and SQLite DB names
          that Telegram derives from package name.
          Common patterns:
            - "org.telegram.messenger_preferences"
            - "org.telegram.messenger.db"
            - "cache_4_" + package
            - notification channel IDs containing package
          """
          import os, sys, re

          old  = sys.argv[1]
          new  = sys.argv[2]
          root = sys.argv[3]

          # Patterns where old package appears inside a larger string literal
          patterns = [
              (re.compile(re.escape(old + '_preferences')), new + '_preferences'),
              (re.compile(re.escape(old + '.db')),          new + '.db'),
              (re.compile(re.escape(old + '.xml')),         new + '.xml'),
              (re.compile(re.escape(old)),                  new),  # catch-all last
          ]

          fixed = 0
          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if not fname.endswith('.smali'):
                      continue
                  fpath = os.path.join(dirpath, fname)
                  try:
                      with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                          content = f.read()
                  except Exception:
                      continue
                  if old not in content:
                      continue
                  original = content
                  for pat, repl in patterns:
                      content = pat.sub(repl, content)
                  if content != original:
                      fixed += 1
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.write(content)

          print(f'✅ SharedPrefs/DB fix: {fixed} files updated')
          PYEOF
          python3 /tmp/fix_prefs_db.py "$OLD" "$NEW" "$DIR"

      # ─────────────────────────────────────────────
      # 16. TELEGRAM-SPECIFIC: Patch .so native libs
      #     (binary patch package string in .so files)
      # ─────────────────────────────────────────────
      - name: Patch Native Libraries (.so files)
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"

          cat > /tmp/patch_so.py << 'PYEOF'
          #!/usr/bin/env python3
          """
          Binary-patch .so files to replace old package name string.
          IMPORTANT: new package must be <= length of old package.
          If new is shorter, pad with null bytes.
          If new is longer, skip (would corrupt offsets).
          """
          import os, sys

          old  = sys.argv[1].encode('utf-8')
          new  = sys.argv[2].encode('utf-8')
          root = sys.argv[3]

          if len(new) > len(old):
              print(f'⚠️  New package ({len(new)} bytes) > old ({len(old)} bytes).')
              print('   Binary .so patch SKIPPED to avoid corruption.')
              print('   Telegram may still work if JNI uses getPackageName() at runtime.')
              sys.exit(0)

          # Pad new with null bytes if shorter
          padded = new + b'\x00' * (len(old) - len(new))

          patched_files = 0
          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if not fname.endswith('.so'):
                      continue
                  fpath = os.path.join(dirpath, fname)
                  try:
                      with open(fpath, 'rb') as f:
                          data = f.read()
                  except Exception:
                      continue
                  if old not in data:
                      continue
                  count = data.count(old)
                  new_data = data.replace(old, padded)
                  with open(fpath, 'wb') as f:
                      f.write(new_data)
                  patched_files += 1
                  print(f'  Patched {count}x in {fname}')

          print(f'✅ .so binary patch: {patched_files} files patched')
          PYEOF
          python3 /tmp/patch_so.py "$OLD" "$NEW" "$DIR"

      # ─────────────────────────────────────────────
      # 17. TELEGRAM-SPECIFIC: Fix notification
      #     channel & account manager strings
      # ─────────────────────────────────────────────
      - name: Fix Telegram Notification Channels & Account Manager
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"

          # Fix strings.xml and other res values
          find "$DIR/res" -name "*.xml" 2>/dev/null | \
            xargs -r grep -l "$OLD" | \
          while read -r f; do
            sed -i "s|${OLD}|${NEW}|g" "$f"
            echo "  Fixed res: $f"
          done

          # Fix assets if any contain package name
          find "$DIR/assets" -type f 2>/dev/null | \
            xargs -r grep -rl "$OLD" 2>/dev/null | \
          while read -r f; do
            # Only text files
            if file "$f" | grep -qiE 'text|json|xml|ascii'; then
              sed -i "s|${OLD}|${NEW}|g" "$f"
              echo "  Fixed asset: $f"
            fi
          done
          echo "✅ Notification channels & assets fixed"

      # ─────────────────────────────────────────────
      # 18. FINAL VERIFICATION
      # ─────────────────────────────────────────────
      - name: Verify Rename Completeness
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_PACKAGE }}"

          echo "════════════════════════════════════════"
          echo "  POST-RENAME VERIFICATION REPORT"
          echo "════════════════════════════════════════"

          echo ""
          echo "── AndroidManifest.xml ──"
          OLD_COUNT=$(grep -c "$OLD" "$DIR/AndroidManifest.xml" 2>/dev/null || echo 0)
          NEW_COUNT=$(grep -c "$NEW" "$DIR/AndroidManifest.xml" 2>/dev/null || echo 0)
          echo "  Old pkg occurrences : $OLD_COUNT  (should be 0)"
          echo "  New pkg occurrences : $NEW_COUNT"
          head -3 "$DIR/AndroidManifest.xml"

          echo ""
          echo "── apktool.yml ──"
          grep -iE "package|rename|version" "$DIR/apktool.yml" 2>/dev/null || echo "  (not found)"

          echo ""
          echo "── Provider authorities ──"
          grep -n "authorities" "$DIR/AndroidManifest.xml" || echo "  None found"

          echo ""
          echo "── requiredSplitTypes ──"
          grep -n "requiredSplitTypes" "$DIR/AndroidManifest.xml" \
            && echo "⚠️  WARNING: still present" \
            || echo "  ✅ Clean"

          echo ""
          echo "── Old pkg remaining in smali ──"
          SMALI_OLD=$(grep -rl "$OLD" "$DIR" --include="*.smali" 2>/dev/null | wc -l)
          echo "  Smali files with old pkg: $SMALI_OLD  (should be 0)"
          [ "$SMALI_OLD" -gt 0 ] && \
            grep -rl "$OLD" "$DIR" --include="*.smali" | head -10

          echo ""
          echo "── Old pkg remaining in .so files ──"
          SO_OLD=$(find "$DIR" -name "*.so" -exec grep -lc "$OLD" {} \; 2>/dev/null | \
            awk '{s+=$1} END {print s+0}')
          echo "  .so files with old pkg: $SO_OLD"

          echo ""
          echo "── BuildConfig check ──"
          find "$DIR" -name "BuildConfig.smali" 2>/dev/null | \
            xargs -r grep -n "APPLICATION_ID\|PACKAGE\|$OLD\|$NEW" | head -10

          echo "════════════════════════════════════════"

      # ─────────────────────────────────────────────
      # 19. RECOMPILE APK
      # ─────────────────────────────────────────────
      - name: Recompile APK
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          OUT="recompiled_unsigned.apk"

          build_apk() {
            local label="$1"; shift
            echo ""
            echo "═══ Build attempt: $label ═══"
            if apktool b "$DIR" -o "$OUT" -f "$@" 2>&1; then
              echo "✅ Build SUCCESS ($label)"
              return 0
            fi
            echo "⚠️  Build FAILED ($label)"
            return 1
          }

          rm -f "$OUT"
          build_apk "default" \
            || build_apk "aapt2"              --use-aapt2 \
            || build_apk "aapt2+no-crunch"    --use-aapt2 --no-crunch \
            || build_apk "aapt2+no-src"       --use-aapt2 --no-crunch --no-src \
            || { echo "❌ All build attempts failed!"; exit 1; }

          [ ! -f "$OUT" ] && { echo "❌ APK not created!"; exit 1; }
          ls -lh "$OUT"

      # ─────────────────────────────────────────────
      # 20. VERIFY APK STRUCTURE
      # ─────────────────────────────────────────────
      - name: Verify APK Structure
        run: |
          echo "── aapt2 dump badging ──"
          aapt2 dump badging recompiled_unsigned.apk 2>&1 | head -20 \
            || echo "⚠️  aapt2 dump warning"

          echo ""
          echo "── Package name in APK ──"
          aapt dump badging recompiled_unsigned.apk 2>/dev/null | grep "^package:" \
            || echo "  (check manually)"

          echo ""
          echo "── APK contents (top 30) ──"
          unzip -l recompiled_unsigned.apk | head -30

      # ─────────────────────────────────────────────
      # 21. GENERATE KEYSTORE
      # ─────────────────────────────────────────────
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4baes \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4baes123 \
            -keypass   w4baes123 \
            -dname "CN=W4BAES,OU=Dev,O=W4BAES,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt
          echo "✅ Keystore generated"

      # ─────────────────────────────────────────────
      # 22. ZIPALIGN
      # ─────────────────────────────────────────────
      - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          zipalign -c -v 4 aligned.apk \
            && echo "✅ Alignment: PASSED" \
            || echo "⚠️  Alignment: FAILED (continuing anyway)"

      # ─────────────────────────────────────────────
      # 23. SIGN (v1 + v2 + v3)
      # ─────────────────────────────────────────────
      - name: Sign APK
        run: |
          apksigner sign \
            --ks             my.keystore \
            --ks-pass        pass:w4baes123 \
            --key-pass       pass:w4baes123 \
            --ks-key-alias   w4baes \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out signed_app.apk \
            aligned.apk

          apksigner verify --verbose --print-certs signed_app.apk \
            && echo "✅ Signature: PASSED" \
            || { echo "❌ Signature: FAILED"; exit 1; }
          ls -lh signed_app.apk

      # ─────────────────────────────────────────────
      # 24. FINAL PACKAGE CONFIRMATION
      # ─────────────────────────────────────────────
      - name: Final Package Name Confirmation
        run: |
          echo "── Final APK package name ──"
          aapt2 dump badging signed_app.apk 2>/dev/null | grep "^package:" \
            || aapt  dump badging signed_app.apk 2>/dev/null | grep "^package:" \
            || echo "  (check manually with aapt)"

      # ─────────────────────────────────────────────
      # 25. UPLOAD ARTIFACT
      # ─────────────────────────────────────────────
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: telegram-repackaged-apk
          path: signed_app.apk
          retention-days: 90

      # ─────────────────────────────────────────────
      # 26. CREATE GITHUB RELEASE
      # ─────────────────────────────────────────────
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: telegram-v1.0.${{ github.run_number }}
          name: Telegram Repackaged v1.0.${{ github.run_number }}
          body: |
            ## Telegram Repackaged Build #${{ github.run_number }}

            | Field        | Value                            |
            |--------------|----------------------------------|
            | New Package  | `${{ env.NEW_PACKAGE }}`         |
            | Old Package  | `${{ env.OLD_PACKAGE }}`         |
            | Build        | `#${{ github.run_number }}`      |
            | Signing      | v1 + v2 + v3 (apksigner)         |
            | Java         | OpenJDK 17                       |
            | APKTool      | 2.10.0                           |
            | Build Tools  | 34.0.0                           |

            ### ✅ Telegram-specific crash fixes applied
            - ApplicationLoader & BuildConfig package fix
            - NativeLoader .so path fix
            - Binary `.so` package string patch
            - SharedPreferences & DB name fix
            - Notification channel ID fix
            - Provider authority fix
            - res/ & assets/ package string fix
            - Physical smali directory rename
            - AndroidManifest attribute cleanup
            - apktool.yml `renameManifestPackage` set

          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

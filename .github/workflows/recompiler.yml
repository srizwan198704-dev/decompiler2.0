name: W4B Recompile

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/apksigner /usr/local/bin/apksigner
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/zipalign /usr/local/bin/zipalign
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          aapt2 version
          apksigner version

      - name: Setup APKTool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE=""
          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp"
          fi
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "Detected old package: $OLD_PACKAGE"

      - name: Fix Invalid Smali Directives
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "Fixing invalid smali directives"
          
          # Create Python fix script
          cat > /tmp/fix_smali.py << 'PYEOF'
import re
import os
import sys

def fix_smali_file(file_path):
    try:
        with open(file_path, 'r', encoding='utf-8') as f:
            content = f.read()
        
        original_content = content
        changes_made = False
        
        # Fix 1: Remove invalid .bKash and .customerapp as directives (lines starting with .)
        lines = content.split('\n')
        fixed_lines = []
        for line in lines:
            stripped = line.strip()
            # If line starts with .bKash or .customerapp (invalid smali directive)
            if stripped.startswith('.bKash') or stripped.startswith('.customerapp'):
                line = '# ' + line  # Comment it out
                changes_made = True
            fixed_lines.append(line)
        
        content = '\n'.join(fixed_lines)
        
        # Fix 2: Fix const-string lines that have unquoted .bKash or .customerapp
        def fix_const_strings(match):
            full_line = match.group(0)
            # Fix unquoted .bKash
            if '.bKash' in full_line and not re.search(r'"[^"]*\.bKash[^"]*"', full_line):
                full_line = full_line.replace('.bKash', '".bKash"')
            # Fix unquoted .customerapp
            if '.customerapp' in full_line and not re.search(r'"[^"]*\.customerapp[^"]*"', full_line):
                full_line = full_line.replace('.customerapp', '".customerapp"')
            return full_line
        
        content = re.sub(r'const-string\s+[^,]+,\s*[^"\n]+', fix_const_strings, content)
        
        # Fix 3: Fix Lcom.uc.browser.e.bKash pattern
        content = re.sub(r'Lcom/uc/browser/e\.bKash', 'Lcom/uc/browser/e', content)
        content = re.sub(r'Lcom/uc/browser/e\.customerapp', 'Lcom/uc/browser/e', content)
        
        # Fix 4: Remove any invalid characters in class names
        content = re.sub(r'L([a-zA-Z0-9_/]+)\.(bKash|customerapp);', r'L\1;', content)
        
        if content != original_content:
            with open(file_path, 'w', encoding='utf-8') as f:
                f.write(content)
            return True
        return False
    except Exception as e:
        print(f"Error fixing {file_path}: {e}")
        return False

# Find and fix all smali files
smali_dirs = ['decompiled_app/smali', 'decompiled_app/smali_classes2']
fixed_count = 0

for smali_dir in smali_dirs:
    if os.path.exists(smali_dir):
        for root, dirs, files in os.walk(smali_dir):
            for file in files:
                if file.endswith('.smali'):
                    file_path = os.path.join(root, file)
                    if fix_smali_file(file_path):
                        fixed_count += 1
                        print(f"Fixed: {file_path}")

print(f"Fixed {fixed_count} smali files")
PYEOF
          
          python3 /tmp/fix_smali.py

      - name: Rename Package in AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.bkash.customerapp"
          cp "$MANIFEST" "$MANIFEST.bak"
          cat > /tmp/fix_manifest.py << 'PYEOF'
import re
import sys
import xml.etree.ElementTree as ET

old = sys.argv[1]
new = sys.argv[2]
path = sys.argv[3]

with open(path, "r", encoding="utf-8") as f:
    content = f.read()

escaped = re.escape(old)
if new.startswith(old):
    suffix = re.escape(new[len(old):])
    pattern = escaped + r'(?!' + suffix + r')'
else:
    pattern = escaped

count = len(re.findall(pattern, content))
result = re.sub(pattern, new, content)

with open(path, "w", encoding="utf-8") as f:
    f.write(result)

print(f"Replaced {count} occurrences: {old} -> {new}")

try:
    ET.parse(path)
    print("XML validation: OK")
except ET.ParseError as e:
    print(f"XML ERROR: {e}")
    sys.exit(1)
PYEOF
          python3 /tmp/fix_manifest.py "$OLD" "$NEW" "$MANIFEST"
          echo "=== First 5 lines after rename ==="
          head -5 "$MANIFEST"

      - name: Rename Package in smali files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.bkash.customerapp"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW" | tr '.' '/')
          
          echo "Replacing smali references: $OLD -> $NEW"
          
          # Replace dotted package references in smali/xml/properties files
          find "$DECOMPILED_DIR" -type f \( -name "*.smali" -o -name "*.xml" -o -name "*.properties" \) | while read file; do
            sed -i "s|${OLD}|${NEW}|g" "$file"
          done
          
          # Replace slash-separated path references in smali
          find "$DECOMPILED_DIR" -type f -name "*.smali" | while read file; do
            sed -i "s|${OLD_PATH}|${NEW_PATH}|g" "$file"
          done
          
          echo "Smali rename done"

      - name: Rename Package Directories
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PATH=$(echo "${{ env.OLD_PACKAGE }}" | tr '.' '/')
          NEW_PATH="com/bkash/customerapp"
          
          # Rename directories in smali folders
          for smali_dir in "$DECOMPILED_DIR/smali" "$DECOMPILED_DIR/smali_classes2"; do
            if [ -d "$smali_dir" ]; then
              old_full_path="$smali_dir/$OLD_PATH"
              new_full_path="$smali_dir/$NEW_PATH"
              
              # Create new directory structure
              mkdir -p "$(dirname "$new_full_path")"
              
              # Move if old directory exists
              if [ -d "$old_full_path" ]; then
                mv "$old_full_path" "$new_full_path" 2>/dev/null || true
                echo "Moved $old_full_path to $new_full_path"
              fi
            fi
          done
          
          echo "Directory rename done"

      - name: Clean Smali Files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "Cleaning smali files..."
          
          # Remove lines that start with .bKash or .customerapp (invalid directives)
          find "$DECOMPILED_DIR" -type f -name "*.smali" | while read file; do
            sed -i '/^[[:space:]]*\.bKash/d' "$file"
            sed -i '/^[[:space:]]*\.customerapp/d' "$file"
          done
          
          # Fix common smali syntax errors
          find "$DECOMPILED_DIR" -type f -name "*.smali" | while read file; do
            sed -i 's/;->->/;->/g' "$file"
            sed -i 's/const-string \([^,]*\), \([^"]*\)$/const-string \1, "\2"/g' "$file"
          done
          
          echo "Smali cleaning done"

      - name: Recompile APK
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=== Attempt 1: default ==="
          if apktool b "$DIR" -o recompiled_unsigned.apk -f 2>&1; then
            echo "Build success (attempt 1)"
          else
            echo "=== Attempt 2: with aapt2 ==="
            if apktool b "$DIR" -o recompiled_unsigned.apk -f --use-aapt2 2>&1; then
              echo "Build success (attempt 2)"
            else
              echo "=== Attempt 3: aapt2 + no-crunch ==="
              apktool b "$DIR" -o recompiled_unsigned.apk -f --use-aapt2 --no-crunch || true
            fi
          fi
          
          if [ ! -f recompiled_unsigned.apk ]; then
            echo "ERROR: APK not created!"
            exit 1
          fi
          
          ls -lh recompiled_unsigned.apk

      - name: Verify APK structure
        run: |
          aapt2 dump badging recompiled_unsigned.apk | head -5 || \
            echo "Warning: aapt2 dump failed (may still be installable)"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4b \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4b123 \
            -keypass w4b123 \
            -dname "CN=W4B,OU=Dev,O=W4B,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt
          echo "Keystore generated"

      - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          echo "Zipalign done"
          zipalign -c -v 4 aligned.apk && echo "Alignment check: PASSED" || echo "Alignment check: FAILED"

      - name: Sign APK with apksigner
        run: |
          apksigner sign \
            --ks my.keystore \
            --ks-pass pass:w4b123 \
            --key-pass pass:w4b123 \
            --ks-key-alias w4b \
            --out signed_app.apk \
            aligned.apk
          echo "Signing done"
          apksigner verify --verbose signed_app.apk && echo "Signature verify: PASSED" || echo "Signature verify: FAILED"
          ls -lh signed_app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-apk
          path: signed_app.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4b-v1.0.${{ github.run_number }}
          name: W4B v1.0.${{ github.run_number }}
          body: |
            ✅ New Package: com.bkash.customerapp
            📦 Original Package: ${{ env.OLD_PACKAGE }}
            🔧 Build Number: #${{ github.run_number }}
            🔑 Signed with apksigner (v2/v3 scheme)
            🛠️ Fixed smali directive errors
          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

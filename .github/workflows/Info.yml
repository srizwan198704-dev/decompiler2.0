name: APK Analyzer - Screen Share Detection

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 grep findutils

      - name: Analyze AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=========================================="
          echo "📦 PACKAGE INFO"
          echo "=========================================="
          grep -oP 'package="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Package Name: {}"
          grep -oP 'android:versionName="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Version Name: {}"
          grep -oP 'android:versionCode="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Version Code: {}"
          grep -oP 'android:minSdkVersion="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Min SDK: {}"
          grep -oP 'android:targetSdkVersion="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Target SDK: {}"

      - name: List All Permissions
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=========================================="
          echo "🔐 PERMISSIONS"
          echo "=========================================="
          grep -oP 'uses-permission.*?android:name="\K[^"]+' "$MANIFEST" | sort

      - name: List Activities, Services, Receivers
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=========================================="
          echo "🏃 ACTIVITIES"
          echo "=========================================="
          grep -oP '<activity[^>]*android:name="\K[^"]+' "$MANIFEST"

          echo "=========================================="
          echo "⚙️ SERVICES"
          echo "=========================================="
          grep -oP '<service[^>]*android:name="\K[^"]+' "$MANIFEST"

          echo "=========================================="
          echo "📡 BROADCAST RECEIVERS"
          echo "=========================================="
          grep -oP '<receiver[^>]*android:name="\K[^"]+' "$MANIFEST"

          echo "=========================================="
          echo "🔌 PROVIDERS"
          echo "=========================================="
          grep -oP '<provider[^>]*android:name="\K[^"]+' "$MANIFEST"

      - name: 📱 SCREEN SHARE DETECTION - MediaProjection APIs
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "🎬 SCREEN SHARE / SCREEN RECORDING DETECTION"
          echo "=========================================="
          
          echo "▶️ MediaProjection Manager (Main Screen Capture API):"
          grep -rn 'MediaProjection' "$DIR" --include="*.smali" 2>/dev/null | head -30
          
          echo ""
          echo "▶️ MediaProjectionManager class:"
          grep -rn 'MediaProjectionManager' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ createScreenCaptureIntent:"
          grep -rn 'createScreenCaptureIntent' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ getMediaProjection:"
          grep -rn 'getMediaProjection' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ VirtualDisplay (for screen capture):"
          grep -rn 'VirtualDisplay' "$DIR" --include="*.smali" 2>/dev/null | head -20

      - name: 🔍 Screen Share Related Classes
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📚 SCREEN SHARE RELATED CLASSES"
          echo "=========================================="
          
          echo "▶️ DisplayManager:"
          grep -rn 'DisplayManager' "$DIR" --include="*.smali" 2>/dev/null | head -15
          
          echo ""
          echo "▶️ Display.VIRTUAL_DISPLAY:"
          grep -rn 'VIRTUAL_DISPLAY' "$DIR" --include="*.smali" 2>/dev/null | head -15
          
          echo ""
          echo "▶️ ScreenCapture/Recording:"
          grep -rn 'ScreenCapture\|ScreenRecording' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ Surface (for displaying captured screen):"
          grep -rn 'Surface\"' "$DIR" --include="*.smali" 2>/dev/null | grep -i 'capture\|record\|share' | head -15

      - name: 🚨 Screen Share Permissions Check
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=========================================="
          echo "⚠️ SCREEN SHARE PERMISSIONS"
          echo "=========================================="
          
          echo "▶️ BIND_MEDIA_PROJECTION_SERVICE:"
          grep -n 'BIND_MEDIA_PROJECTION_SERVICE' "$MANIFEST" || echo "Not found"
          
          echo ""
          echo "▶️ FOREGROUND_SERVICE (required for screen recording service):"
          grep -n 'FOREGROUND_SERVICE' "$MANIFEST" || echo "Not found"
          
          echo ""
          echo "▶️ SYSTEM_ALERT_WINDOW (overlay permission):"
          grep -n 'SYSTEM_ALERT_WINDOW' "$MANIFEST" || echo "Not found"

      - name: 🎥 Screen Share String Patterns
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📝 SCREEN SHARE STRING PATTERNS"
          echo "=========================================="
          
          echo "▶️ 'screen share' keyword:"
          grep -rin 'screen share' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ 'screen recording' keyword:"
          grep -rin 'screen recording' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ 'screen cast' keyword:"
          grep -rin 'screen cast\|screencast' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ 'share screen' keyword:"
          grep -rin 'share screen' "$DIR" --include="*.smali" 2>/dev/null | head -20
          
          echo ""
          echo "▶️ 'start capture' keyword:"
          grep -rin 'start capture' "$DIR" --include="*.smali" 2>/dev/null | head -15

      - name: 📱 Third-Party Screen Share SDKs
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "🔧 THIRD-PARTY SCREEN SHARE SDKS"
          echo "=========================================="
          
          echo "▶️ Agora.io (Video/Screen SDK):"
          grep -rn 'agora' "$DIR" --include="*.smali" 2>/dev/null | grep -i 'screen\|video' | head -10
          
          echo ""
          echo "▶️ Zoom SDK:"
          grep -rn 'zoom' "$DIR" --include="*.smali" 2>/dev/null | grep -i 'screen\|share' | head -10
          
          echo ""
          echo "▶️ WebRTC (Screen sharing support):"
          grep -rn 'webrtc\|WebRTC' "$DIR" --include="*.smali" 2>/dev/null | head -15
          
          echo ""
          echo "▶️ Jitsi Meet SDK:"
          grep -rn 'jitsi' "$DIR" --include="*.smali" 2>/dev/null | head -10
          
          echo ""
          echo "▶️ LiveStream/RTMP (Screen broadcast):"
          grep -rn 'rtmp\|livestream\|broadcast' "$DIR" --include="*.smali" 2>/dev/null | head -15

      - name: 🎯 Screen Share Service Detection
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "⚙️ SCREEN SHARE SERVICES & CALLBACKS"
          echo "=========================================="
          
          echo "▶️ MediaProjection.Callback:"
          grep -rn 'MediaProjection\$Callback\|onStop\|onStart' "$DIR" --include="*.smali" 2>/dev/null | head -15
          
          echo ""
          echo "▶️ Screen capture intent filter:"
          grep -rn 'ACTION_MEDIA_PROJECTION\|MediaProjection' "$DIR" --include="*.xml" 2>/dev/null | head -10
          
          echo ""
          echo "▶️ Recording service classes:"
          grep -rn 'RecordService\|CaptureService\|ScreenService' "$DIR" --include="*.smali" 2>/dev/null | head -20

      - name: 📊 Screen Share Detection Summary
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          
          MP_COUNT=$(grep -rn 'MediaProjection' "$DIR" --include="*.smali" 2>/dev/null | wc -l)
          VD_COUNT=$(grep -rn 'VirtualDisplay' "$DIR" --include="*.smali" 2>/dev/null | wc -l)
          SS_COUNT=$(grep -rin 'screen share\|screen recording\|screencast' "$DIR" --include="*.smali" 2>/dev/null | wc -l)
          
          echo "=========================================="
          echo "📈 SCREEN SHARE DETECTION SUMMARY"
          echo "=========================================="
          echo "MediaProjection references: $MP_COUNT"
          echo "VirtualDisplay references: $VD_COUNT"
          echo "Screen share string matches: $SS_COUNT"
          echo ""
          
          if [ $MP_COUNT -gt 0 ] || [ $VD_COUNT -gt 0 ]; then
            echo "🚨 WARNING: Screen capture/recording code detected!"
            echo "The app has screen share capability."
          else
            echo "✅ No screen share code detected."
          fi

      - name: Scan for Package Names in Smali
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📋 PACKAGE NAMES FOUND (com.* / org.* / io.*)"
          echo "=========================================="
          grep -rho 'com\.[a-zA-Z0-9_\.]\+' "$DIR" --include="*.smali" | \
            sort -u | grep -v '^\.' | head -100
          echo "---"
          grep -rho 'org\.[a-zA-Z0-9_\.]\+' "$DIR" --include="*.smali" | \
            sort -u | head -50
          echo "---"
          grep -rho 'io\.[a-zA-Z0-9_\.]\+' "$DIR" --include="*.smali" | \
            sort -u | head -50

      - name: Scan for URLs and Endpoints
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "🌐 URLS & ENDPOINTS"
          echo "=========================================="
          grep -rho 'https\?://[a-zA-Z0-9./?=_%&-]*' "$DIR" \
            --include="*.smali" --include="*.xml" | \
            sort -u | head -100

      - name: Count DEX & Smali Stats
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📊 CODE STATS"
          echo "=========================================="
          echo "Total smali files: $(find "$DIR" -name '*.smali' | wc -l)"
          echo "Total XML files:   $(find "$DIR" -name '*.xml' | wc -l)"
          echo "Total PNG files:   $(find "$DIR" -name '*.png' | wc -l)"
          echo "Smali folders:     $(find "$DIR" -maxdepth 1 -name 'smali*' -type d | sort)"

      - name: Generate Complete Report
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          MANIFEST="$DIR/AndroidManifest.xml"
          
          {
            echo "# 🎬 Screen Share Detection Report"
            echo "Generated: $(date)"
            echo ""
            echo "## 📊 Detection Summary"
            echo "- MediaProjection: $(grep -rn 'MediaProjection' "$DIR" --include="*.smali" 2>/dev/null | wc -l) occurrences"
            echo "- VirtualDisplay: $(grep -rn 'VirtualDisplay' "$DIR" --include="*.smali" 2>/dev/null | wc -l) occurrences"
            echo "- Screen share strings: $(grep -rin 'screen share\|screen recording' "$DIR" --include="*.smali" 2>/dev/null | wc -l) occurrences"
            echo ""
            echo "## 🚨 Critical Screen Share APIs Found"
            echo '```'
            grep -rn 'MediaProjection\|VirtualDisplay\|createScreenCaptureIntent' "$DIR" --include="*.smali" 2>/dev/null | head -50
            echo '```'
            echo ""
            echo "## 📝 Screen Share Related Strings"
            echo '```'
            grep -rin 'screen share\|screencast\|screen recording\|share screen' "$DIR" --include="*.smali" 2>/dev/null | head -30
            echo '```'
            echo ""
            echo "## 🔧 Third-Party SDKs (Video/Screen Share)"
            echo '```'
            grep -rn 'agora\|webrtc\|jitsi\|zoom' "$DIR" --include="*.smali" 2>/dev/null | head -30
            echo '```'
          } > screen_share_report.txt
          
          cat screen_share_report.txt

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: screen-share-detection-report
          path: |
            screen_share_report.txt
            ${{ github.event.inputs.decompiled_folder }}
          retention-days: 30

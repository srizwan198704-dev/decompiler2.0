name: APK Analyzer - WhatsApp Pin Code Finder

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 grep findutils

      - name: Analyze AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=========================================="
          echo "📦 PACKAGE INFO"
          echo "=========================================="
          grep -oP 'package="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Package Name: {}"
          grep -oP 'android:versionName="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Version Name: {}"
          grep -oP 'android:versionCode="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Version Code: {}"
          grep -oP 'android:minSdkVersion="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Min SDK: {}"
          grep -oP 'android:targetSdkVersion="\K[^"]+' "$MANIFEST" | head -1 | xargs -I{} echo "Target SDK: {}"

      - name: List All Permissions
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=========================================="
          echo "🔐 PERMISSIONS"
          echo "=========================================="
          grep -oP 'uses-permission.*?android:name="\K[^"]+' "$MANIFEST" | sort

      - name: List Activities, Services, Receivers
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=========================================="
          echo "🏃 ACTIVITIES"
          echo "=========================================="
          grep -oP '<activity[^>]*android:name="\K[^"]+' "$MANIFEST"

          echo "=========================================="
          echo "⚙️ SERVICES"
          echo "=========================================="
          grep -oP '<service[^>]*android:name="\K[^"]+' "$MANIFEST"

          echo "=========================================="
          echo "📡 BROADCAST RECEIVERS"
          echo "=========================================="
          grep -oP '<receiver[^>]*android:name="\K[^"]+' "$MANIFEST"

          echo "=========================================="
          echo "🔌 PROVIDERS"
          echo "=========================================="
          grep -oP '<provider[^>]*android:name="\K[^"]+' "$MANIFEST"

      - name: Scan for Package Names in Smali
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📋 PACKAGE NAMES FOUND (com.* / org.* / io.*)"
          echo "=========================================="
          grep -rho 'com\.[a-zA-Z0-9_\.]\+' "$DIR" --include="*.smali" | \
            sort -u | grep -v '^\.' | head -100
          echo "---"
          grep -rho 'org\.[a-zA-Z0-9_\.]\+' "$DIR" --include="*.smali" | \
            sort -u | head -50
          echo "---"
          grep -rho 'io\.[a-zA-Z0-9_\.]\+' "$DIR" --include="*.smali" | \
            sort -u | head -50

      - name: 🔍 SPECIFIC SEARCH - WhatsApp Package Name
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📱 SEARCHING FOR 'com.whatsapp' PACKAGE NAME"
          echo "=========================================="
          
          echo "▶️ In AndroidManifest.xml:"
          grep -n 'com.whatsapp' "$DIR/AndroidManifest.xml" 2>/dev/null || echo "Not found"
          
          echo ""
          echo "▶️ In Smali files:"
          grep -rn 'com\.whatsapp' "$DIR" --include="*.smali" 2>/dev/null | head -50
          
          echo ""
          echo "▶️ In XML files:"
          grep -rn 'com\.whatsapp' "$DIR" --include="*.xml" 2>/dev/null | head -30
          
          echo ""
          echo "▶️ Total occurrences:"
          grep -r 'com\.whatsapp' "$DIR" --include="*.smali" --include="*.xml" 2>/dev/null | wc -l

      - name: 🔐 SPECIFIC SEARCH - Pin Code / Password Related Data
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "🔢 SEARCHING FOR PIN CODE / PASSWORD RELATED DATA"
          echo "=========================================="
          
          echo "▶️ Searching for 'pin' keyword:"
          grep -rin 'pin' "$DIR" --include="*.smali" --include="*.xml" 2>/dev/null | \
            grep -v '\.png' | grep -v '\.jpg' | head -50
          
          echo ""
          echo "▶️ Searching for 'pincode' keyword:"
          grep -rin 'pincode' "$DIR" --include="*.smali" --include="*.xml" 2>/dev/null | head -30
          
          echo ""
          echo "▶️ Searching for 'password' keyword:"
          grep -rin 'password' "$DIR" --include="*.smali" --include="*.xml" 2>/dev/null | head -30
          
          echo ""
          echo "▶️ Searching for 'passcode' keyword:"
          grep -rin 'passcode' "$DIR" --include="*.smali" --include="*.xml" 2>/dev/null | head -30
          
          echo ""
          echo "▶️ Searching for 4-6 digit numbers (potential pins):"
          grep -roh '\b[0-9]\{4,6\}\b' "$DIR" --include="*.smali" --include="*.xml" 2>/dev/null | \
            sort -u | head -50
          
          echo ""
          echo "▶️ Searching for 'key' related strings:"
          grep -rin 'keystore\|secret\|token\|auth' "$DIR" --include="*.smali" 2>/dev/null | head -30

      - name: Scan for URLs and Endpoints
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "🌐 URLS & ENDPOINTS"
          echo "=========================================="
          grep -rho 'https\?://[a-zA-Z0-9./?=_%&-]*' "$DIR" \
            --include="*.smali" --include="*.xml" | \
            sort -u | head -100

      - name: Scan for Third-Party SDKs & Libraries
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📚 THIRD-PARTY SDKS DETECTED"
          echo "=========================================="
          SDKS=(
            "firebase" "google" "facebook" "adjust" "appsflyer"
            "crashlytics" "amplitude" "segment" "mixpanel" "branch"
            "onesignal" "intercom" "zendesk" "stripe" "paypal"
            "okhttp" "retrofit" "glide" "picasso" "gson" "jackson"
            "rxjava" "coroutine" "dagger" "hilt" "room" "realm"
          )
          for sdk in "${SDKS[@]}"; do
            count=$(grep -rl "$sdk" "$DIR" --include="*.smali" 2>/dev/null | wc -l)
            if [ "$count" -gt 0 ]; then
              echo "✅ $sdk ($count files)"
            fi
          done

      - name: Count DEX & Smali Stats
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📊 CODE STATS"
          echo "=========================================="
          echo "Total smali files: $(find "$DIR" -name '*.smali' | wc -l)"
          echo "Total XML files:   $(find "$DIR" -name '*.xml' | wc -l)"
          echo "Total PNG files:   $(find "$DIR" -name '*.png' | wc -l)"
          echo "Smali folders:     $(find "$DIR" -maxdepth 1 -name 'smali*' -type d | sort)"
          echo ""
          echo "Top 10 largest smali files:"
          find "$DIR" -name '*.smali' -exec wc -l {} + 2>/dev/null | \
            sort -rn | head -11

      - name: Scan for Deep Links & Custom Schemes
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "🔗 DEEP LINKS / CUSTOM URL SCHEMES"
          echo "=========================================="
          grep -rn 'android:scheme' "$DIR/AndroidManifest.xml" | \
            grep -oP 'android:scheme="\K[^"]+' | sort -u

      - name: 📍 EXTRACT PIN CODE LOCATIONS (Detailed)
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=========================================="
          echo "📍 FILE LOCATIONS CONTAINING PIN/CODE DATA"
          echo "=========================================="
          
          echo "▶️ Files containing 'pin' (with line numbers):"
          grep -rn 'pin' "$DIR" --include="*.smali" 2>/dev/null | \
            grep -v '\.png' | \
            awk -F':' '{print $1 " (line: " $2 ")"}' | \
            sort -u | head -30
          
          echo ""
          echo "▶️ Files containing 'pincode':"
          grep -rl 'pincode' "$DIR" --include="*.smali" 2>/dev/null | \
            head -20
          
          echo ""
          echo "▶️ Files with potential hardcoded numbers (4-6 digits):"
          grep -rl '\b[0-9]\{4,6\}\b' "$DIR" --include="*.smali" 2>/dev/null | \
            head -20

      - name: Generate Summary Report
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          MANIFEST="$DIR/AndroidManifest.xml"
          PKG=$(grep -oP 'package="\K[^"]+' "$MANIFEST" | head -1)
          VER=$(grep -oP 'android:versionName="\K[^"]+' "$MANIFEST" | head -1)
          PERM_COUNT=$(grep -c 'uses-permission' "$MANIFEST" || echo 0)
          SMALI_COUNT=$(find "$DIR" -name '*.smali' | wc -l)

          echo "=========================================="
          echo "📝 SUMMARY"
          echo "=========================================="
          echo "App Package : $PKG"
          echo "Version     : $VER"
          echo "Permissions : $PERM_COUNT"
          echo "Smali Files : $SMALI_COUNT"
          echo "Analyzed at : $(date)"
          
          echo ""
          echo "WhatsApp Package Found: $(grep -r 'com.whatsapp' "$DIR" --include="*.smali" 2>/dev/null | wc -l) times"
          echo "Pin-related entries found: $(grep -rin 'pin\|pincode\|passcode' "$DIR" --include="*.smali" 2>/dev/null | wc -l) times"

      - name: Upload Analysis Report
        uses: actions/upload-artifact@v4
        with:
          name: whatsapp-pin-analysis-report
          path: |
            analysis_report.txt
            ${{ github.event.inputs.decompiled_folder }}
          retention-days: 30

      - name: Create Detailed Report File
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          MANIFEST="$DIR/AndroidManifest.xml"
          
          {
            echo "# 🔍 WhatsApp Pin Code Analysis Report"
            echo "Generated: $(date)"
            echo ""
            echo "## 📱 WhatsApp Package Detection"
            echo '```'
            grep -rn 'com.whatsapp' "$DIR" --include="*.smali" 2>/dev/null | head -100
            echo '```'
            echo ""
            echo "## 🔢 Pin Code Related Findings"
            echo '```'
            echo "=== PIN KEYWORD ==="
            grep -rin 'pin' "$DIR" --include="*.smali" 2>/dev/null | grep -v '\.png' | head -50
            echo ""
            echo "=== PINCODE KEYWORD ==="
            grep -rin 'pincode' "$DIR" --include="*.smali" 2>/dev/null | head -30
            echo ""
            echo "=== PASSWORD KEYWORD ==="
            grep -rin 'password' "$DIR" --include="*.smali" 2>/dev/null | head -30
            echo ""
            echo "=== 4-6 DIGIT NUMBERS (Potential Pins) ==="
            grep -roh '\b[0-9]\{4,6\}\b' "$DIR" --include="*.smali" 2>/dev/null | sort -u | head -50
            echo '```'
            echo ""
            echo "## 📍 File Locations"
            echo '```'
            echo "Files with 'pin':"
            grep -rl 'pin' "$DIR" --include="*.smali" 2>/dev/null | head -30
            echo ""
            echo "Files with numbers (4-6 digits):"
            grep -rl '\b[0-9]\{4,6\}\b' "$DIR" --include="*.smali" 2>/dev/null | head -20
            echo '```'
          } > analysis_report.txt
          
          cat analysis_report.txt

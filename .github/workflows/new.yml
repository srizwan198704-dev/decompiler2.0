name: W4B Recompile

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/apksigner /usr/local/bin/apksigner
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/zipalign /usr/local/bin/zipalign
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

      - name: Setup APKTool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE=""
          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp"
          fi
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "Detected old package: $OLD_PACKAGE"

      - name: Rename Package in AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.bKash.customerapp"
          cp "$MANIFEST" "$MANIFEST.bak"
          cat > /tmp/fix.py << 'PYEOF'
          import re, sys, xml.etree.ElementTree as ET
          old = sys.argv[1]
          new = sys.argv[2]
          path = sys.argv[3]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # 1. Package name replace - Capital K রাখলাম
          escaped = re.escape(old)
          if new.startswith(old):
              suffix = re.escape(new[len(old):])
              pattern = escaped + r'(?!' + suffix + r')'
          else:
              pattern = escaped
          content = re.sub(pattern, new, content)

          # 2. Remove split attributes that cause "parsing package" error
          content = re.sub(r'\s+android:requiredSplitTypes="[^"]*"', '', content)
          content = re.sub(r'\s+android:splitTypes="[^"]*"', '', content)
          content = re.sub(r'\s+android:isSplitRequired="[^"]*"', '', content)
          content = re.sub(r'\s+android:extractNativeLibs="[^"]*"', '', content)
          content = re.sub(r'\s+android:useEmbeddedDex="[^"]*"', '', content)
          content = re.sub(r'\s+android:isFeatureSplit="[^"]*"', '', content)

          # 3. Fix versionCode for install
          content = re.sub(r'android:versionCode="\d+"', 'android:versionCode="999999"', content)

          # 4. Fix install location
          content = re.sub(r'android:installLocation="[^"]*"', 'android:installLocation="auto"', content)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)
          print(f"Manifest package: {new}")
          print("Removed split attributes + fixed versionCode")
          try:
              ET.parse(path)
              print("XML validation: OK")
          except ET.ParseError as e:
              print(f"XML ERROR: {e}")
              sys.exit(1)
          PYEOF
          python3 /tmp/fix.py "$OLD" "$NEW" "$MANIFEST"
          head -5 "$MANIFEST"

      - name: Rename Package in smali files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW_MANIFEST="com.bKash.customerapp"
          NEW_SMALI="com.bkash.customerapp"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW_SMALI" | tr '.' '/')

          echo "Manifest uses: $NEW_MANIFEST with Capital K"
          echo "Smali uses: $NEW_SMALI with small k for compatibility"

          # 1. xml/properties এ Manifest এর Capital K ভার্সন
          find "$DECOMPILED_DIR" -type f \( -name "*.xml" -o -name "*.properties" \) -exec sed -i "s|${OLD}|${NEW_MANIFEST}|g" {} +

          # 2. smali তে const-string - Capital K দিলে রানটাইম ক্র্যাশ, তাই small
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|\"${OLD}\"|\"${NEW_SMALI}\"|g" {} +

          # 3. smali তে content:// URI - small
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|\"content://${OLD}|\"content://${NEW_SMALI}|g" {} +

          # 4. smali তে ক্লাস পাথ - স্ল্যাশ দিয়ে small k, নাইলে Invalid directive
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|L${OLD_PATH}/|L${NEW_PATH}/|g" {} +

          # 5. smali তে const-class
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|const-class [vp][0-9]\+, L${OLD_PATH}/|const-class v0, L${NEW_PATH}/|g" {} +

          echo "Smali rename done - Capital K only in Manifest"

      - name: Deep clean old package references
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW_MANIFEST="com.bKash.customerapp"
          NEW_SMALI="com.bkash.customerapp"

          find "$DECOMPILED_DIR/res" -type f -name "*.xml" -exec sed -i "s|${OLD}|${NEW_MANIFEST}|g" {} +
          find "$DECOMPILED_DIR/assets" -type f -exec sed -i "s|${OLD}|${NEW_SMALI}|g" {} + 2>/dev/null || true

          if [ -f "$DECOMPILED_DIR/apktool.yml" ]; then
            sed -i "s|renameManifestPackage: null|renameManifestPackage: ${NEW_MANIFEST}|g" "$DECOMPILED_DIR/apktool.yml"
            sed -i "s|renameManifestPackage: ${OLD}|renameManifestPackage: ${NEW_MANIFEST}|g" "$DECOMPILED_DIR/apktool.yml"
          fi

      - name: Recompile APK
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          apktool b "$DIR" -o recompiled_unsigned.apk -f --use-aapt2
          if [! -f recompiled_unsigned.apk ]; then
            echo "ERROR: APK not created!"
            exit 1
          fi
          ls -lh recompiled_unsigned.apk

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore \
            -alias bkash \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bkash123 \
            -keypass bkash123 \
            -dname "CN=bKash,OU=Dev,O=bKash,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt

      - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk

      - name: Sign APK with apksigner
        run: |
          apksigner sign \
            --ks my.keystore \
            --ks-pass pass:bkash123 \
            --key-pass pass:bkash123 \
            --ks-key-alias bkash \
            --v4-signing-enabled false \
            --out signed_app.apk \
            aligned.apk
          apksigner verify --verbose signed_app.apk
          ls -lh signed_app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkash-apk
          path: signed_app.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: bkash-v1.0.${{ github.run_number }}
          name: bKash v1.0.${{ github.run_number }}
          body: |
            ✅ Manifest Package: com.bKash.customerapp
            ✅ Smali Package: com.bkash.customerapp
            📦 Original: ${{ env.OLD_PACKAGE }}
            🔧 Fixed parsing package error
          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

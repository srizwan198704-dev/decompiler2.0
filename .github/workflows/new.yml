name: W4B Recompile Capital K

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java + Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3
          wget -q https://github.com/google/android-classyshark/releases/download/9.1/classyshark.jar -O /tmp/classyshark.jar
          wget -q https://bitbucket.org/JesusFreke/smali/downloads/smali-3.0.3.jar -O /usr/local/bin/smali.jar
          wget -q https://bitbucket.org/JesusFreke/smali/downloads/baksmali-3.0.3.jar -O /usr/local/bin/baksmali.jar

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/apksigner /usr/local/bin/apksigner
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/zipalign /usr/local/bin/zipalign

      - name: Setup APKTool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Detect Old Package
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          echo "OLD_PACKAGE=${OLD_PACKAGE:-com.whatsapp}" >> $GITHUB_ENV

      - name: Fix Manifest with Capital K
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.bKash.customerapp"
          python3 << EOF
          import re
          with open("$MANIFEST", "r") as f:
              c = f.read()
          c = re.sub(r'package="${OLD}"', 'package="${NEW}"', c)
          c = re.sub(r'\s+android:requiredSplitTypes="[^"]*"', '', c)
          c = re.sub(r'\s+android:splitTypes="[^"]*"', '', c)
          c = re.sub(r'\s+android:isSplitRequired="[^"]*"', '', c)
          c = re.sub(r'\s+android:extractNativeLibs="[^"]*"', '', c)
          c = re.sub(r'android:versionCode="\d+"', 'android:versionCode="999999"', c)
          with open("$MANIFEST", "w") as f:
              f.write(c)
          EOF

      - name: Rename Smali with Capital K - Break Limitation
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.bKash.customerapp"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW" | tr '.' '/')
          
          echo "Old: $OLD_PATH -> New: $NEW_PATH"
          
          # 1. সব xml এ Capital K
          find "$DECOMPILED_DIR" -type f \( -name "*.xml" -o -name "*.properties" \) -exec sed -i "s|${OLD}|${NEW}|g" {} +
          
          # 2. smali তে string এ Capital K
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|\"${OLD}\"|\"${NEW}\"|g" {} +
          
          # 3. smali তে class path Capital K দিয়ে রিপ্লেস
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|L${OLD_PATH}/|L${NEW_PATH}/|g" {} +
          
          # 4. ফোল্ডার স্ট্রাকচার রিনেম - এটাই Limitation Break
          if [ -d "$DECOMPILED_DIR/smali/$OLD_PATH" ]; then
            mkdir -p "$DECOMPILED_DIR/smali/$(dirname $NEW_PATH)"
            mv "$DECOMPILED_DIR/smali/$OLD_PATH" "$DECOMPILED_DIR/smali/$NEW_PATH"
          fi
          
          # smali_classes2,3,4 এর জন্যও
          for i in 2 3 4 5 6 7 8 9; do
            if [ -d "$DECOMPILED_DIR/smali_classes$i/$OLD_PATH" ]; then
              mkdir -p "$DECOMPILED_DIR/smali_classes$i/$(dirname $NEW_PATH)"
              mv "$DECOMPILED_DIR/smali_classes$i/$OLD_PATH" "$DECOMPILED_DIR/smali_classes$i/$NEW_PATH"
            fi
          done
          
          echo "Folder structure renamed to Capital K"

      - name: Recompile with Raw Smali - Bypass Apktool Parser
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          
          # apktool বাদ দিয়ে ডিরেক্ট smali.jar ইউজ করব যাতে Capital K পাথ কম্পাইল হয়
          rm -rf classes_out
          mkdir classes_out
          
          # সব smali ফোল্ডার কম্পাইল করো
          for d in smali smali_classes2 smali_classes3 smali_classes4 smali_classes5; do
            if [ -d "$DIR/$d" ]; then
              java -jar /usr/local/bin/smali.jar assemble "$DIR/$d" -o "classes_out/$(echo $d | sed 's/smali/classes/').dex"
            fi
          done
          
          # resource বিল্ড করো aapt2 দিয়ে
          aapt2 compile --dir "$DIR/res" -o compiled_res.zip
          aapt2 link -o unsigned.apk -I /opt/android-sdk/platforms/android-34/android.jar \
            --manifest "$DIR/AndroidManifest.xml" \
            --min-sdk-version 19 --target-sdk-version 30 \
            --rename-manifest-package com.bKash.customerapp \
            compiled_res.zip
          
          # dex ফাইলগুলা অ্যাড করো
          zip -uj unsigned.apk classes_out/*.dex
          
          # assets/lib কপি করো
          cd "$DIR"
          if [ -d "assets" ]; then zip -r ../unsigned.apk assets; fi
          if [ -d "lib" ]; then zip -r ../unsigned.apk lib; fi
          cd ..
          
          mv unsigned.apk recompiled_unsigned.apk
          ls -lh recompiled_unsigned.apk

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore -alias bkash -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bkash123 -keypass bkash123 -dname "CN=bKash,OU=Dev,O=bKash,L=Dhaka,ST=Dhaka,C=BD" -noprompt
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:bkash123 --key-pass pass:bkash123 \
            --ks-key-alias bkash --v4-signing-enabled false --out signed_app.apk aligned.apk
          apksigner verify --verbose signed_app.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bkash-capital-k
          path: signed_app.apk

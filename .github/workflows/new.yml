name: W4B Recompile Capital K Fixed

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34"
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/apksigner /usr/local/bin/apksigner
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/zipalign /usr/local/bin/zipalign

      - name: Setup APKTool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

      - name: Detect Old Package
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          echo "OLD_PACKAGE=${OLD_PACKAGE:-com.whatsapp}" >> $GITHUB_ENV

      - name: Fix Manifest - Capital K + Remove Split
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.bKash.customerapp"
          python3 << EOF
          import re
          with open("$MANIFEST", "r") as f:
              c = f.read()
          
          # 1. Package name Capital K
          c = re.sub(r'package="${OLD}"', 'package="${NEW}"', c)
          
          # 2. Remove ALL split attributes - এটাই parsing error সলভ করে
          c = re.sub(r'\s+android:requiredSplitTypes="[^"]*"', '', c)
          c = re.sub(r'\s+android:splitTypes="[^"]*"', '', c)
          c = re.sub(r'\s+android:isSplitRequired="[^"]*"', '', c)
          c = re.sub(r'\s+android:isFeatureSplit="[^"]*"', '', c)
          c = re.sub(r'\s+android:extractNativeLibs="[^"]*"', '', c)
          c = re.sub(r'\s+android:useEmbeddedDex="[^"]*"', '', c)
          
          # 3. Fix install issues
          c = re.sub(r'android:versionCode="\d+"', 'android:versionCode="999999"', c)
          c = re.sub(r'android:installLocation="[^"]*"', 'android:installLocation="auto"', c)
          
          # 4. Add tools:replace to force override
          if 'xmlns:tools=' not in c:
              c = c.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
          c = c.replace('<application', '<application tools:replace="android:label,android:icon"', 1)
          
          with open("$MANIFEST", "w") as f:
              f.write(c)
          EOF
          echo "Manifest: Capital K set, splits removed"

      - name: Rename Smali - Small k Only
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.bkash.customerapp"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW" | tr '.' '/')
          
          # Resource এ Capital K রাখব যাতে App Name এ দেখায়
          find "$DECOMPILED_DIR" -type f -name "*.xml" -exec sed -i "s|${OLD}|com.bKash.customerapp|g" {} +
          
          # কিন্তু smali কোডে small k, নাইলে Invalid directive
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|\"${OLD}\"|\"${NEW}\"|g" {} +
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|L${OLD_PATH}/|L${NEW_PATH}/|g" {} +
          
          # ফোল্ডারও small k
          for d in smali smali_classes2 smali_classes3 smali_classes4; do
            if [ -d "$DECOMPILED_DIR/$d/$OLD_PATH" ]; then
              mkdir -p "$DECOMPILED_DIR/$d/$(dirname $NEW_PATH)"
              mv "$DECOMPILED_DIR/$d/$OLD_PATH" "$DECOMPILED_DIR/$d/$NEW_PATH"
            fi
          done
          echo "Smali: small k for compatibility"

      - name: Update apktool.yml
        run: |
          if [ -f "${{ github.event.inputs.decompiled_folder }}/apktool.yml" ]; then
            sed -i "s|renameManifestPackage: .*|renameManifestPackage: com.bKash.customerapp|g" "${{ github.event.inputs.decompiled_folder }}/apktool.yml"
          fi

      - name: Recompile APK
        run: |
          apktool b "${{ github.event.inputs.decompiled_folder }}" -o recompiled_unsigned.apk -f --use-aapt2

      - name: Sign APK
        run: |
          keytool -genkey -v -keystore my.keystore -alias bkash -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bkash123 -keypass bkash123 -dname "CN=bKash,OU=Dev,O=bKash,L=Dhaka,ST=Dhaka,C=BD" -noprompt
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:bkash123 --key-pass pass:bkash123 \
            --ks-key-alias bkash --v4-signing-enabled false --out signed_app.apk aligned.apk
          apksigner verify --verbose signed_app.apk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: bkash-capital-k
          path: signed_app.apk

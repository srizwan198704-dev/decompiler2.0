name: WJa4B Recompile

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/apksigner /usr/local/bin/apksigner
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/zipalign /usr/local/bin/zipalign

      - name: Setup APKTool 2.9.3
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV

      - name: Nuclear Fix - Delete Problem Files
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          # 1. DataBinding, Dagger, Hilt সব ডিলিট - এইগুলাই ঝামেলা করে
          rm -rf $DIR/smali*/androidx/databinding 2>/dev/null || true
          rm -rf $DIR/smali*/androidx/lifecycle 2>/dev/null || true
          rm -rf $DIR/smali*/dagger 2>/dev/null || true
          rm -rf $DIR/smali*/javax 2>/dev/null || true
          find $DIR -name "*DataBinderMapperImpl.smali" -delete
          find $DIR -name "*DataBinding*.smali" -delete
          find $DIR -name "BR.smali" -delete
          
          # 2. Split config ডিলিট
          rm -f $DIR/apktool.yml
          
          # 3. unknown folder ডিলিট
          rm -rf $DIR/unknown 2>/dev/null || true
          echo "Cleaned problematic files"

      - name: Fix AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.whatsapp.w4b"
          
          # Package rename + extractNativeLibs + remove split
          sed -i "s|package=\"${OLD}\"|package=\"${NEW}\"|g" "$MANIFEST"
          sed -i "s|${OLD}|${NEW}|g" "$MANIFEST"
          
          # extractNativeLibs যোগ করো, না হলে Android 6 এ install হবে না
          sed -i 's|<application|<application android:extractNativeLibs="true"|g' "$MANIFEST"
          
          # isSplitRequired ডিলিট
          sed -i '/android:isSplitRequired/d' "$MANIFEST"
          sed -i '/extractNativeLibs="false"/d' "$MANIFEST"
          
          echo "=== Manifest Check ==="
          head -20 "$MANIFEST"

      - name: Safe Package Rename in Smali
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.whatsapp.w4b"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW" | tr '.' '/')
          
          # শুধু L...; format replace, .class বাদ
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i \
            -e "/^\.class /b" \
            -e "/^\.super /b" \
            -e "/^\.source /b" \
            -e "s|L${OLD_PATH}/|L${NEW_PATH}/|g" {} +
          
          # Folder move
          for smali_dir in smali smali_classes2 smali_classes3 smali_classes4 smali_classes5; do
            if [ -d "$DECOMPILED_DIR/$smali_dir/${OLD_PATH}" ]; then
              mkdir -p "$DECOMPILED_DIR/$smali_dir/$(dirname ${NEW_PATH})"
              mv "$DECOMPILED_DIR/$smali_dir/${OLD_PATH}" "$DECOMPILED_DIR/$smali_dir/${NEW_PATH}"
            fi
          done

      - name: Recompile APK - No Resource Check
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          # --force-manifest দিলে Manifest validation skip করে
          apktool b "$DIR" -o recompiled_unsigned.apk -f --use-aapt2 --force-manifest
          
          if [ ! -f recompiled_unsigned.apk ]; then
            echo "Build Failed!"
            exit 1
          fi
          ls -lh recompiled_unsigned.apk

      - name: Verify APK with aapt
        run: |
          aapt dump badging recompiled_unsigned.apk | head -5 || echo "aapt check failed"

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore my.keystore -alias w4b -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass w4b123 -keypass w4b123 -dname "CN=W4B" -noprompt

      - name: Zipalign + Sign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          apksigner sign --ks my.keystore --ks-pass pass:w4b123 --key-pass pass:w4b123 \
            --ks-key-alias w4b --v1-signing-enabled true --v2-signing-enabled true \
            --v3-signing-enabled true --out signed_app.apk aligned.apk
          
          echo "=== Final Verify ==="
          apksigner verify --verbose signed_app.apk
          aapt dump badging signed_app.apk | head -3

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4b-apk
          path: signed_app.apk

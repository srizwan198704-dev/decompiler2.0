name: W4B RecompileAPKTOOL

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
            - name: Checkout
        uses: actions/checkout@v3

            - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3

            - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0" "platforms;android-34" "platform-tools"
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt /usr/local/bin/aapt
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/apksigner /usr/local/bin/apksigner
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/zipalign /usr/local/bin/zipalign
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV

            - name: Setup APKTool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar

            - name: Set Package Names
        run: |
          echo "OLD_PACKAGE=ru.maximoff.apktool" >> $GITHUB_ENV
          echo "NEW_MANIFEST=com.bKash.customerapp" >> $GITHUB_ENV
          echo "NEW_SMALI=com.bkash.customerapp" >> $GITHUB_ENV

            - name: Rename Package in AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="${{ env.NEW_MANIFEST }}"
          cat > /tmp/fix.py << 'PYEOF'
          import re, sys, xml.etree.ElementTree as ET
          old, new, path = sys.argv[1], sys.argv[2], sys.argv[3]
          with open(path, "r", encoding="utf-8") as f: content = f.read()
          escaped = re.escape(old)
          pattern = escaped + r'(?!' + re.escape(new[len(old):]) + r')' if new.startswith(old) else escaped
          result = re.sub(pattern, new, content)
          with open(path, "w", encoding="utf-8") as f: f.write(result)
          ET.parse(path)
          print(f"Manifest renamed: {old} -> {new}")
          PYEOF
          python3 /tmp/fix.py "$OLD" "$NEW" "$MANIFEST"

            - name: Rename Package in smali files and move folders
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW_SMALI="${{ env.NEW_SMALI }}"
          NEW_MANIFEST="${{ env.NEW_MANIFEST }}"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW_SMALI" | tr '.' '/')
          echo "Old: $OLD | New Manifest: $NEW_MANIFEST | New Smali: $NEW_SMALI"

          find "$DECOMPILED_DIR" -type f \( -name "*.xml" -o -name "*.properties" \) \
            -exec sed -i "s|${OLD}|${NEW_MANIFEST}|g" {} +

          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|\"${OLD}\"|\"${NEW_SMALI}\"|g" {} +
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|\"content://${OLD}|\"content://${NEW_SMALI}|g" {} +
          find "$DECOMPILED_DIR" -type f -name "*.smali" -exec sed -i "s|L${OLD_PATH}/|L${NEW_PATH}/|g" {} +

          for SMALI_DIR in "$DECOMPILED_DIR"/smali*; do
            if [ -d "$SMALI_DIR/$OLD_PATH" ]; then
              echo "Moving $SMALI_DIR/$OLD_PATH -> $SMALI_DIR/$NEW_PATH"
              mkdir -p "$SMALI_DIR/$NEW_PATH"
              mv "$SMALI_DIR/$OLD_PATH"/* "$SMALI_DIR/$NEW_PATH"/ 2>/dev/null || true
              rm -rf "$SMALI_DIR/$OLD_PATH"
            fi
          done

            - name: Fix missing resource IDs and clean build
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW_MANIFEST="${{ env.NEW_MANIFEST }}"
          NEW_SMALI="${{ env.NEW_SMALI }}"

          find "$DECOMPILED_DIR/res" -type f -name "*.xml" -exec sed -i "s|${OLD}|${NEW_MANIFEST}|g" {} +
          find "$DECOMPILED_DIR/assets" -type f -exec sed -i "s|${OLD}|${NEW_SMALI}|g" {} + 2>/dev/null || true

          rm -f "$DECOMPILED_DIR/res/values/public.xml"
          rm -f "$DECOMPILED_DIR/res/values/ids.xml"
          rm -rf "$DECOMPILED_DIR/build"

          mkdir -p "$DECOMPILED_DIR/res/values"
          echo "Extracting @id references..."
          IDS=$(grep -rhoP '@\+id/\K[a-zA-Z0-9_]+' "$DECOMPILED_DIR/res" 2>/dev/null | sort -u)
          echo '<?xml version="1.0" encoding="utf-8"?>' > "$DECOMPILED_DIR/res/values/ids.xml"
          echo '<resources>' >> "$DECOMPILED_DIR/res/values/ids.xml"
          for ID in $IDS; do
            echo " <item type=\"id\" name=\"$ID\" />" >> "$DECOMPILED_DIR/res/values/ids.xml"
          done
          echo '</resources>' >> "$DECOMPILED_DIR/res/values/ids.xml"
          echo "Generated ids.xml with $(echo "$IDS" | wc -w) IDs"

          cat > "$DECOMPILED_DIR/apktool.yml" << 'EOF'
!!brut.androlib.meta.MetaInfo
apkFileName: base.apk
compressionType: false
doNotCompress:
- resources.arsc
isFrameworkApk: false
packageInfo:
  forcedPackageId: '127'
  renameManifestPackage: com.bKash.customerapp
sdkInfo:
  minSdkVersion: '21'
  targetSdkVersion: '34'
sharedLibrary: false
sparseResources: false
unknownFiles: {}
usesFramework:
  ids:
    - 1
  tag: null
version: 2.10.0
versionInfo:
  versionCode: '1'
  versionName: 1.0
EOF

            - name: Recompile APK
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=== Building with aapt2 + force-all ==="
          apktool b "$DIR" -o recompiled_unsigned.apk -f --use-aapt2 --force-all 2>&1 | tee /tmp/build.log || \
          apktool b "$DIR" -o recompiled_unsigned.apk -f --force-all 2>&1 | tee -a /tmp/build.log

          if [! -f recompiled_unsigned.apk ]; then
            echo "ERROR: APK not created!"
            echo "=== Last 30 lines of build log ==="
            tail -30 /tmp/build.log
            exit 1
          fi
          ls -lh recompiled_unsigned.apk

            - name: Verify APK structure
        run: |
          unzip -l recompiled_unsigned.apk | grep -E "classes.dex|AndroidManifest.xml|resources.arsc"
          aapt dump badging recompiled_unsigned.apk | head -3

            - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore \
            -alias bkash \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bkash123 \
            -keypass bkash123 \
            -dname "CN=bKash,OU=Dev,O=bKash,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt

            - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          zipalign -c -v 4 aligned.apk

            - name: Sign APK with apksigner
        run: |
          apksigner sign \
            --ks my.keystore \
            --ks-pass pass:bkash123 \
            --key-pass pass:bkash123 \
            --ks-key-alias bkash \
            --out signed_app.apk \
            aligned.apk
          apksigner verify --verbose signed_app.apk

            - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: bkash-apk
          path: signed_app.apk
          retention-days: 90

            - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: bkash-v1.0.${{ github.run_number }}
          name: bKash v1.0.${{ github.run_number }}
          body: |
            ✅ Manifest Package: com.bKash.customerapp
            ✅ Smali Package: com.bkash.customerapp
            📦 Original: ru.maximoff.apktool
            🔧 Build: #${{ github.run_number }}
            🔑 Signed with apksigner
            🔧 Fixed: ids.xml auto-gen + smali folder move
          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

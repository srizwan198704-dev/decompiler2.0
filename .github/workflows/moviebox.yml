name: W4BAES

on:
  workflow_dispatch:
    inputs:
      decompiled_folder:
        description: 'Decompiled folder name'
        required: true
        default: 'decompiled_app'

jobs:
  recompile:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Java
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jre-headless zipalign wget unzip python3

      - name: Setup Android SDK
        run: |
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          sudo mkdir -p /opt/android-sdk/cmdline-tools
          sudo unzip -q cmdline-tools.zip -d /opt/android-sdk/cmdline-tools
          sudo mv /opt/android-sdk/cmdline-tools/cmdline-tools /opt/android-sdk/cmdline-tools/latest
          export ANDROID_SDK_ROOT=/opt/android-sdk
          export PATH="$PATH:/opt/android-sdk/cmdline-tools/latest/bin"
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "build-tools;34.0.0"
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/aapt2 /usr/local/bin/aapt2
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/apksigner /usr/local/bin/apksigner
          sudo ln -sf /opt/android-sdk/build-tools/34.0.0/zipalign /usr/local/bin/zipalign
          echo "/opt/android-sdk/build-tools/34.0.0" >> $GITHUB_PATH
          echo "ANDROID_SDK_ROOT=/opt/android-sdk" >> $GITHUB_ENV
          aapt2 version
          apksigner version

      - name: Setup APKTool
        run: |
          sudo wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool \
            -O /usr/local/bin/apktool
          sudo wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar \
            -O /usr/local/bin/apktool.jar
          sudo chmod +x /usr/local/bin/apktool /usr/local/bin/apktool.jar
          apktool --version

      - name: Detect Old Package Name
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD_PACKAGE=""
          if [ -f "$DECOMPILED_DIR/AndroidManifest.xml" ]; then
            OLD_PACKAGE=$(grep -oP 'package="\K[^"]+' "$DECOMPILED_DIR/AndroidManifest.xml" | head -1)
          fi
          if [ -z "$OLD_PACKAGE" ]; then
            OLD_PACKAGE="com.whatsapp.w4b"
          fi
          echo "OLD_PACKAGE=$OLD_PACKAGE" >> $GITHUB_ENV
          echo "Detected old package: $OLD_PACKAGE"

      - name: Rename Package in AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.konasl.nagad"
          cp "$MANIFEST" "$MANIFEST.bak"
          cat > /tmp/fix.py << 'PYEOF'
          import re, sys, xml.etree.ElementTree as ET
          old = sys.argv[1]
          new = sys.argv[2]
          path = sys.argv[3]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()
          escaped = re.escape(old)
          if new.startswith(old):
              suffix = re.escape(new[len(old):])
              pattern = escaped + r'(?!' + suffix + r')'
          else:
              pattern = escaped
          count = len(re.findall(pattern, content))
          result = re.sub(pattern, new, content)
          with open(path, "w", encoding="utf-8") as f:
              f.write(result)
          print(f"Replaced {count} occurrences: {old} -> {new}")
          try:
              ET.parse(path)
              print("XML validation: OK")
          except ET.ParseError as e:
              print(f"XML ERROR: {e}")
              sys.exit(1)
          PYEOF
          python3 /tmp/fix.py "$OLD" "$NEW" "$MANIFEST"
          echo "=== First 5 lines after rename ==="
          head -5 "$MANIFEST"

      - name: Fix requiredSplitTypes in AndroidManifest.xml
        run: |
          MANIFEST="${{ github.event.inputs.decompiled_folder }}/AndroidManifest.xml"
          echo "=== Before fix: manifest tag ==="
          grep -n "requiredSplitTypes\|isSplitRequired" "$MANIFEST" || echo "Attributes not found"

          cat > /tmp/fix_manifest.py << 'PYEOF'
          import sys
          import re

          path = sys.argv[1]
          with open(path, "r", encoding="utf-8") as f:
              content = f.read()

          # Strategy 1: If requiredSplitTypes exists but isSplitRequired is missing or false,
          # add android:isSplitRequired="true" to the <manifest tag
          has_required_split_types = 'requiredSplitTypes' in content
          has_is_split_required_true = 'android:isSplitRequired="true"' in content

          if has_required_split_types and not has_is_split_required_true:
              # Remove requiredSplitTypes attribute entirely — safest fix for recompile
              content = re.sub(r'\s+android:requiredSplitTypes="[^"]*"', '', content)
              content = re.sub(r'\s+requiredSplitTypes="[^"]*"', '', content)
              print("Removed requiredSplitTypes attribute from manifest")
          else:
              print("No fix needed or isSplitRequired already true")

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Fix complete")
          PYEOF

          python3 /tmp/fix_manifest.py "$MANIFEST"

          echo "=== After fix: manifest tag ==="
          grep -n "requiredSplitTypes\|isSplitRequired" "$MANIFEST" || echo "Attributes cleanly removed"

      - name: Rename Package in XML and Properties files (dotted form)
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.konasl.nagad"
          find "$DECOMPILED_DIR" \
            -type f \( -name "*.xml" -o -name "*.properties" \) \
            ! -name "AndroidManifest.xml" \
            -exec sed -i "s|${OLD}|${NEW}|g" {} +
          echo "XML/properties dotted rename done"

      - name: Rename Package in apktool.yml
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.konasl.nagad"
          if [ -f "$DECOMPILED_DIR/apktool.yml" ]; then
            sed -i "s|${OLD}|${NEW}|g" "$DECOMPILED_DIR/apktool.yml"
            echo "apktool.yml updated:"
            grep -i "package\|rename\|version" "$DECOMPILED_DIR/apktool.yml" || true
          else
            echo "apktool.yml not found, skipping"
          fi

      - name: Rename Package in smali files (slash-path form only)
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.konasl.nagad"
          OLD_PATH=$(echo "$OLD" | tr '.' '/')
          NEW_PATH=$(echo "$NEW" | tr '.' '/')
          echo "Replacing smali slash-paths: $OLD_PATH -> $NEW_PATH"
          find "$DECOMPILED_DIR" \
            -type f -name "*.smali" \
            -exec sed -i "s|${OLD_PATH}|${NEW_PATH}|g" {} +
          echo "Smali slash-path rename done"

      - name: Rename dotted package in smali string literals only
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          NEW="com.konasl.nagad"
          cat > /tmp/fix_smali_strings.py << 'PYEOF'
          import os, sys, re

          old = sys.argv[1]
          new = sys.argv[2]
          root = sys.argv[3]

          escaped_old = re.escape(old)
          if new.startswith(old):
              suffix = re.escape(new[len(old):])
              dot_pattern = re.compile(escaped_old + r'(?!' + suffix + r')')
          else:
              dot_pattern = re.compile(escaped_old)

          string_line_pattern = re.compile(
              r'^\s*(const-string(?:/jumbo)?|\.annotation|value\s*=)',
              re.IGNORECASE
          )

          total = 0
          for dirpath, _, filenames in os.walk(root):
              for fname in filenames:
                  if not fname.endswith('.smali'):
                      continue
                  fpath = os.path.join(dirpath, fname)
                  with open(fpath, 'r', encoding='utf-8', errors='replace') as f:
                      lines = f.readlines()
                  new_lines = []
                  changed = False
                  for line in lines:
                      if string_line_pattern.match(line) and old in line:
                          new_line = dot_pattern.sub(new, line)
                          if new_line != line:
                              total += 1
                              changed = True
                          new_lines.append(new_line)
                      else:
                          new_lines.append(line)
                  if changed:
                      with open(fpath, 'w', encoding='utf-8') as f:
                          f.writelines(new_lines)

          print(f"Replaced dotted package in {total} smali string lines")
          PYEOF
          python3 /tmp/fix_smali_strings.py "$OLD" "$NEW" "$DECOMPILED_DIR"

      - name: Verify no old package remains in critical files
        run: |
          DECOMPILED_DIR="${{ github.event.inputs.decompiled_folder }}"
          OLD="${{ env.OLD_PACKAGE }}"
          echo "=== Checking AndroidManifest.xml ==="
          grep -c "$OLD" "$DECOMPILED_DIR/AndroidManifest.xml" || echo "0 occurrences (good)"
          echo "=== Checking apktool.yml ==="
          grep "$OLD" "$DECOMPILED_DIR/apktool.yml" || echo "0 occurrences (good)"
          echo "=== Sample smali string lines still containing old name ==="
          grep -rn "const-string.*$OLD" "$DECOMPILED_DIR" --include="*.smali" | head -10 || echo "0 found (good)"
          echo "=== FileProvider authority check ==="
          grep -rn "authorities" "$DECOMPILED_DIR/AndroidManifest.xml" || echo "No FileProvider found"
          echo "=== requiredSplitTypes check ==="
          grep -n "requiredSplitTypes" "$DECOMPILED_DIR/AndroidManifest.xml" || echo "requiredSplitTypes not present (good)"

      - name: Recompile APK
        run: |
          DIR="${{ github.event.inputs.decompiled_folder }}"
          echo "=== Attempt 1: default ==="
          if apktool b "$DIR" -o recompiled_unsigned.apk -f 2>&1; then
            echo "Build success (attempt 1)"
          else
            echo "=== Attempt 2: with aapt2 ==="
            if apktool b "$DIR" -o recompiled_unsigned.apk -f --use-aapt2 2>&1; then
              echo "Build success (attempt 2)"
            else
              echo "=== Attempt 3: aapt2 + no-crunch ==="
              apktool b "$DIR" -o recompiled_unsigned.apk -f --use-aapt2 --no-crunch 2>&1 || true
            fi
          fi
          if [ ! -f recompiled_unsigned.apk ]; then
            echo "ERROR: APK not created!"
            exit 1
          fi
          ls -lh recompiled_unsigned.apk

      - name: Verify APK structure
        run: |
          aapt2 dump badging recompiled_unsigned.apk | head -10 || \
            echo "Warning: aapt2 dump failed (may still be installable)"

      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore my.keystore \
            -alias w4baes \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass w4baes123 \
            -keypass w4baes123 \
            -dname "CN=W4BAES,OU=Dev,O=W4BAES,L=Dhaka,ST=Dhaka,C=BD" \
            -noprompt
          echo "Keystore generated"

      - name: Zipalign APK
        run: |
          zipalign -v -p 4 recompiled_unsigned.apk aligned.apk
          echo "Zipalign done"
          zipalign -c -v 4 aligned.apk && echo "Alignment check: PASSED" || echo "Alignment check: FAILED"

      - name: Sign APK with apksigner
        run: |
          apksigner sign \
            --ks my.keystore \
            --ks-pass pass:w4baes123 \
            --key-pass pass:w4baes123 \
            --ks-key-alias w4baes \
            --out signed_app.apk \
            aligned.apk
          echo "Signing done"
          apksigner verify --verbose signed_app.apk && echo "Signature verify: PASSED" || echo "Signature verify: FAILED"
          ls -lh signed_app.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: w4baes-apk
          path: signed_app.apk
          retention-days: 90

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: w4baes-v1.0.${{ github.run_number }}
          name: W4BAES v1.0.${{ github.run_number }}
          body: |
            ✅ Package: com.konasl.nagad
            📦 Original: ${{ env.OLD_PACKAGE }}
            🔧 Build: #${{ github.run_number }}
            🔑 Signed with apksigner (v2/v3 scheme)
          files: signed_app.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

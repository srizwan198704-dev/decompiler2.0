<!DOCTYPE html>
<html>
    <head>
        <meta http-equiv="content-type"  content="text/html; charset=utf-8" />
        <meta http-equiv="Cache-Control" content="no-cache" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no" />
        <title>DEBUG CHANGE ENV</title>
        <style type="text/css">
body {line-height:1.4em;font-size:14px;font-family:'Microsoft Yahei','Simsun','Gotham-Medium',Arial;color:#333;}

.wrap {margin-top:-50px;width:100%;position:absolute;top:45%;left:0;}
.list {margin:5px 10px;height:38px;position:relative;}
.btn-blue {height:30px;padding:0 10px;color:#fff;border:1px #1c91d2 solid;background:#21aaf6;border-radius:3px;box-shadow:inset 0 1px 0 #81d7fe;}
</style>
    </head>

    <body>
        <script type="text/javascript">

    //获得并传递选中选项
    function btnOnclick(selectAge){
        oListbox = document.getElementById(selectAge);
        var index = oListbox.selectedIndex;
        var val = oListbox.options[index].value
        alert("获得选中的选项内容："+ val);
        var params = [val];
        ucweb.startRequest("shell.debugcmd.env", params);
    }

</script>

        <div class="wrap">

            <div class="list">
                <span class="txt">PLEASE SELECT ENV:</span>
                <select name="selectAge" id="selectENVSWITCH">
                    <option value="india_online">印度生产(India-Online)</option>
                    <option value="india_test">印度测试(India-Test)</option>
                    <option value="indonesia_online">印尼生产(Indonesia-Online)</option>
                    <option value="indonesia_test">印尼测试(Indonesia-Test)</option>
                    <option value="normal_online">通英生产(Normal-Online)</option>
                    <option value="normal_test">通英测试(Normal-Test)</option>
                    <option value="russia_online">俄罗斯生产(Russia-Online)</option>
                    <option value="russia_test">俄罗斯测试(Russia-Test)</option>
                </select>
                <button type="button" id="select_env_btn" onClick="javascript:btnOnclick('selectENVSWITCH');" class="btn-blue">SWITCH ENV</button>
            </div>
        </div>

    </body>
</html>
